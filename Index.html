<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Дневник">
<meta name="theme-color" content="#05060f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Дневник ⚠️</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{margin:0;height:100%;overflow:hidden}
:root{
  --txt:#f2f4ff;--dim:rgba(242,244,255,.55);--dim2:rgba(242,244,255,.35);
  --accent:#6ea8ff;--danger:#ff3b30;--ok:#34d399;
  color-scheme:dark;
}
html[data-theme="light"]{color-scheme:light;--txt:#0d1220;--dim:rgba(13,18,32,.6);--dim2:rgba(13,18,32,.4)}
body{
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,sans-serif;
  color:var(--txt);background:#05060f;display:flex;flex-direction:column;height:100dvh;
  user-select:none;-webkit-user-select:none;-webkit-font-smoothing:antialiased;
}
#bg{position:fixed;inset:0;z-index:-3;
  background:radial-gradient(120% 80% at 50% 0%,#161d42 0%,#080a1a 45%,#03040a 100%);}
html[data-theme="light"] #bg{background:radial-gradient(120% 80% at 50% 0%,#dfe7ff 0%,#eef2ff 45%,#f7f9ff 100%)}
.blob{position:fixed;border-radius:50%;filter:blur(64px);opacity:.55;z-index:-2;animation:float 20s ease-in-out infinite;will-change:transform}
.blob.b1{width:340px;height:340px;background:#4d6bff;top:-90px;left:-100px}
.blob.b2{width:300px;height:300px;background:#b14dff;top:18%;right:-120px;animation-delay:-7s}
.blob.b3{width:360px;height:360px;background:#00d4c8;bottom:-140px;left:-70px;animation-delay:-13s}
.blob.b4{width:240px;height:240px;background:#ff4d94;bottom:20%;right:-90px;animation-delay:-4s;opacity:.35}
@keyframes float{0%,100%{transform:translate3d(0,0,0) scale(1)}33%{transform:translate3d(34px,-42px,0) scale(1.14)}66%{transform:translate3d(-28px,26px,0) scale(.94)}}

.glass{
  position:relative;
  background:linear-gradient(145deg,rgba(255,255,255,.16),rgba(255,255,255,.05));
  -webkit-backdrop-filter:blur(22px) saturate(180%);
  backdrop-filter:blur(22px) saturate(180%);
  border:1px solid rgba(255,255,255,.16);
  box-shadow:0 8px 32px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.28),inset 0 -1px 0 rgba(255,255,255,.06);
  border-radius:22px;
}
html[data-theme="light"] .glass{
  background:linear-gradient(145deg,rgba(255,255,255,.85),rgba(255,255,255,.55));
  border-color:rgba(255,255,255,.9);
  box-shadow:0 8px 30px rgba(30,50,110,.16),inset 0 1px 0 #fff;
}
.glass::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(120deg,rgba(255,255,255,.30) 0%,rgba(255,255,255,0) 42%);opacity:.5;mix-blend-mode:overlay}

.tap{transition:transform .18s cubic-bezier(.32,1.5,.5,1),filter .2s}
.tap:active{transform:scale(.955);filter:brightness(1.12)}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:calc(10px + env(safe-area-inset-top)) 18px 10px;z-index:20}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:44px;height:44px;border-radius:16px;display:grid;place-items:center;font-size:22px;
  animation:logoPulse 3s ease-in-out infinite}
@keyframes logoPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.h1{font-size:22px;font-weight:800;letter-spacing:-.4px;line-height:1.15}
.sub{font-size:12px;color:var(--dim);margin-top:2px}
.iconbtn{width:44px;height:44px;border-radius:16px;border:0;display:grid;place-items:center;font-size:19px;
  color:var(--txt);cursor:pointer;flex:none}

/* ---------- main ---------- */
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 16px 170px;position:relative;z-index:1;
  overscroll-behavior-y:contain}
.view{animation:viewIn .45s cubic-bezier(.22,1.1,.36,1) both}
@keyframes viewIn{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}

.hero{padding:20px;border-radius:26px;margin-bottom:16px;overflow:hidden}
.hero .lbl{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--dim);font-weight:700}
.hero .big{font-size:38px;font-weight:800;letter-spacing:-1.5px;margin:6px 0 2px;
  font-variant-numeric:tabular-nums;line-height:1.05}
.hero .big.neg{color:var(--danger)}
.hero .ttl{font-size:16px;font-weight:600;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero .meta{font-size:13px;color:var(--dim);margin-top:3px}
.pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:7px;
  box-shadow:0 0 0 0 rgba(52,211,153,.7);animation:pulseRing 2s infinite}
@keyframes pulseRing{0%{box-shadow:0 0 0 0 rgba(52,211,153,.6)}70%{box-shadow:0 0 0 12px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}

.sect{font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim2);
  font-weight:800;margin:20px 4px 10px}

.card{padding:14px;border-radius:20px;display:flex;gap:12px;align-items:center;margin-bottom:10px;
  animation:cardIn .5s cubic-bezier(.22,1.2,.4,1) both;cursor:pointer}
@keyframes cardIn{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.grow{flex:1;min-width:0}
.ctitle{font-size:15.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.csub{font-size:12.5px;color:var(--dim);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cd{font-size:13px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;flex:none;text-align:right}
.cd.neg{color:var(--danger)}

.empty{padding:40px 16px;text-align:center;color:var(--dim2);font-size:14px}

/* ---------- inputs ---------- */
input,select,textarea,button{font-family:inherit;font-size:16px}
.field{width:100%;padding:13px 14px;border-radius:16px;border:1px solid rgba(255,255,255,.14);
  background:rgba(255,255,255,.07);color:var(--txt);outline:none;transition:.2s;-webkit-appearance:none;appearance:none}
html[data-theme="light"] .field{background:rgba(255,255,255,.7);border-color:rgba(20,40,90,.12);color:#0d1220}
.field:focus{border-color:rgba(120,170,255,.75);box-shadow:0 0 0 4px rgba(90,140,255,.18)}
.field::placeholder{color:var(--dim2)}
.row{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{padding:8px 12px;border-radius:14px;font-size:13px;border:1px solid rgba(255,255,255,.15);
  background:rgba(255,255,255,.06);color:var(--dim);transition:.2s;cursor:pointer}
html[data-theme="light"] .chip{background:rgba(255,255,255,.6);border-color:rgba(20,40,90,.1);color:#3b4664}
.chip.on{background:linear-gradient(145deg,rgba(110,170,255,.5),rgba(110,170,255,.2));color:#fff;
  border-color:rgba(150,200,255,.7);box-shadow:0 0 18px rgba(90,150,255,.4);transform:scale(1.04)}
.btn{padding:13px 16px;border-radius:16px;border:1px solid rgba(255,255,255,.16);cursor:pointer;
  background:rgba(255,255,255,.08);color:var(--txt);font-weight:650;transition:.18s;
  display:flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:scale(.96);filter:brightness(1.15)}
.btn.primary{background:linear-gradient(145deg,#5b8dff,#3f6bff);border-color:rgba(150,190,255,.5);
  box-shadow:0 8px 24px rgba(70,110,255,.45),inset 0 1px 0 rgba(255,255,255,.4);color:#fff}
.btn.danger{background:linear-gradient(145deg,rgba(255,70,60,.9),rgba(200,30,25,.9));
  border-color:rgba(255,150,140,.5);color:#fff}
.btn.ok{background:linear-gradient(145deg,#34d399,#0fa87a);border-color:rgba(150,255,220,.5);color:#04231a}
.label{font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim2);font-weight:800;margin:14px 2px 8px}
.hint{font-size:12.5px;color:var(--dim);line-height:1.5}
.mini{width:30px;height:30px;border-radius:11px;border:1px solid rgba(255,255,255,.15);
  background:rgba(255,255,255,.08);color:var(--txt);display:grid;place-items:center;font-size:14px;cursor:pointer}
.remrow{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;
  border-radius:14px;margin-bottom:6px;font-size:13.5px}

/* ---------- tabbar ---------- */
.tabbar{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));
  display:flex;gap:3px;padding:6px;border-radius:26px;z-index:60}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0;border-radius:20px;
  font-size:10px;font-weight:700;color:var(--dim);background:transparent;border:0;transition:.25s;cursor:pointer}
.tab .ic{font-size:19px;line-height:1;transition:transform .3s cubic-bezier(.32,1.6,.5,1)}
.tab.active{color:var(--txt);background:linear-gradient(145deg,rgba(255,255,255,.24),rgba(255,255,255,.08));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 4px 16px rgba(0,0,0,.3)}
.tab.active .ic{transform:translateY(-2px) scale(1.15)}
.fab{position:fixed;right:18px;bottom:calc(96px + env(safe-area-inset-bottom));width:62px;height:62px;
  border-radius:22px;border:1px solid rgba(180,210,255,.5);font-size:30px;font-weight:300;color:#fff;
  background:linear-gradient(145deg,#6e9dff,#3c62ff);z-index:61;cursor:pointer;
  box-shadow:0 12px 32px rgba(60,100,255,.55),inset 0 1px 0 rgba(255,255,255,.5);
  display:grid;place-items:center;transition:transform .2s cubic-bezier(.32,1.6,.5,1)}
.fab:active{transform:scale(.9) rotate(90deg)}

/* ---------- sheet ---------- */
.sheetwrap{position:fixed;inset:0;z-index:90;display:flex;align-items:flex-end;
  background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  opacity:0;pointer-events:none;transition:opacity .3s}
.sheetwrap.open{opacity:1;pointer-events:auto}
.sheet{width:100%;max-height:92dvh;overflow-y:auto;border-radius:30px 30px 0 0;
  padding:16px 18px calc(28px + env(safe-area-inset-bottom));
  transform:translateY(100%);transition:transform .48s cubic-bezier(.32,1.14,.4,1);
  background:linear-gradient(160deg,rgba(28,34,64,.96),rgba(14,18,36,.98));
  -webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
  border-top:1px solid rgba(255,255,255,.2);box-shadow:0 -20px 60px rgba(0,0,0,.7)}
html[data-theme="light"] .sheet{background:linear-gradient(160deg,rgba(255,255,255,.98),rgba(238,242,255,.98))}
.sheetwrap.open .sheet{transform:translateY(0)}
.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sheettitle{font-size:20px;font-weight:800;letter-spacing:-.3px}
.grab{width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.25);margin:0 auto 12px}

/* ---------- alarm overlay ---------- */
#alarm{position:fixed;inset:0;z-index:300;display:none;flex-direction:column;align-items:center;
  justify-content:center;gap:16px;padding:28px;text-align:center;
  background:radial-gradient(circle at 50% 40%,rgba(255,59,48,.62),rgba(110,0,0,.95));
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
#alarm.on{display:flex;animation:alarmPulse 1.05s infinite}
@keyframes alarmPulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.55)}}
#alarm .warn{font-size:88px;line-height:1;animation:warnBounce .7s infinite alternate cubic-bezier(.32,1.6,.5,1);
  filter:drop-shadow(0 0 30px rgba(255,220,120,.9))}
@keyframes warnBounce{from{transform:scale(1) rotate(-7deg)}to{transform:scale(1.22) rotate(7deg)}}
#alarm .atitle{font-size:26px;font-weight:900;color:#fff;text-shadow:0 4px 20px rgba(0,0,0,.6);max-width:100%}
#alarm .awhen{font-size:15px;color:rgba(255,255,255,.9);font-weight:600}
#alarm .abtns{display:flex;flex-direction:column;gap:10px;width:100%;max-width:340px;margin-top:14px}
#alarm .abtn{padding:17px;border-radius:20px;border:1px solid rgba(255,255,255,.4);font-size:17px;
  font-weight:800;background:rgba(255,255,255,.16);color:#fff;-webkit-backdrop-filter:blur(20px);
  backdrop-filter:blur(20px);cursor:pointer;transition:.18s}
#alarm .abtn:active{transform:scale(.96);background:rgba(255,255,255,.3)}
#alarm .abtn.main{background:#fff;color:#c1121f;border-color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.4)}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:calc(180px + env(safe-area-inset-bottom));transform:translate(-50%,20px);
  padding:12px 20px;border-radius:18px;font-size:14px;font-weight:650;z-index:400;opacity:0;
  pointer-events:none;transition:.35s cubic-bezier(.32,1.4,.4,1);white-space:nowrap;
  background:rgba(20,26,50,.94);border:1px solid rgba(255,255,255,.2);color:#fff;
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:0 10px 30px rgba(0,0,0,.5)}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- calendar ---------- */
.calhead{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-radius:20px;margin-bottom:12px}
.calhead .m{font-size:17px;font-weight:800;text-transform:capitalize}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.wd{text-align:center;font-size:11px;font-weight:800;color:var(--dim2);padding:4px 0}
.day{aspect-ratio:1;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;font-size:14px;font-weight:650;color:var(--txt);background:rgba(255,255,255,.045);
  border:1px solid transparent;transition:.2s;cursor:pointer;position:relative}
html[data-theme="light"] .day{background:rgba(255,255,255,.55)}
.day.out{opacity:.25}
.day.today{border-color:rgba(110,168,255,.9);box-shadow:0 0 14px rgba(110,168,255,.4)}
.day.sel{background:linear-gradient(145deg,#6e9dff,#3c62ff);color:#fff;box-shadow:0 6px 20px rgba(60,100,255,.5)}
.dots{display:flex;gap:2px;height:5px}
.dots i{width:4px;height:4px;border-radius:50%;display:block}

.settingscard{padding:16px;border-radius:22px;margin-bottom:12px}
</style>
</head>
<body>

<div id="bg"></div>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div>

<header class="topbar">
  <div class="brand">
    <div class="logo glass">⚠️</div>
    <div style="min-width:0">
      <div class="h1" id="topTitle">Сегодня</div>
      <div class="sub" id="topDate">—</div>
    </div>
  </div>
  <button class="iconbtn glass tap" id="btnBell" onclick="askNotify()">🔔</button>
</header>

<main id="main"></main>

<button class="fab" onclick="openEditor(null)">＋</button>

<nav class="tabbar glass">
  <button class="tab active" data-tab="today"><span class="ic">🌙</span><span>Сегодня</span></button>
  <button class="tab" data-tab="list"><span class="ic">📋</span><span>Список</span></button>
  <button class="tab" data-tab="cal"><span class="ic">📅</span><span>Календарь</span></button>
  <button class="tab" data-tab="set"><span class="ic">⚙️</span><span>Настройки</span></button>
</nav>

<div class="sheetwrap" id="sheetwrap" onclick="if(event.target===this)closeSheet()">
  <div class="sheet" id="sheet"></div>
</div>

<div id="alarm">
  <div class="warn">⚠️</div>
  <div class="atitle" id="alarmTitle">—</div>
  <div class="awhen" id="alarmWhen">—</div>
  <div class="abtns">
    <button class="abtn main" onclick="dismissAlarm(0)">Я увидел, понял ✓</button>
    <button class="abtn" onclick="dismissAlarm(5)">Напомнить через 5 минут</button>
    <button class="abtn" onclick="dismissAlarm(60)">Напомнить через 1 час</button>
  </div>
</div>

<div id="toast"></div>

<script>
/* =========================================================
   ДАННЫЕ
   ========================================================= */
const KEY='glass_diary_v1';
const COLORS=['#6ea8ff','#b18cff','#ff6ea8','#ffb26e','#6ee7c8','#8cff7a','#ff6e6e','#5ee0ff'];
const PRESETS=[
  {l:'5 мин',s:300},{l:'15 мин',s:900},{l:'30 мин',s:1800},
  {l:'1 ч',s:3600},{l:'2 ч',s:7200},{l:'6 ч',s:21600},{l:'12 ч',s:43200},
  {l:'24 ч',s:86400},{l:'2 дня',s:172800},{l:'4 дня',s:345600},
  {l:'1 нед',s:604800},{l:'2 нед',s:1209600},{l:'1 мес',s:2592000}
];
const DEF={ntfy:'',sound:true,notify:true,theme:'dark'};
const FIRE_WINDOW=30*60*1000; // окно «дозвона» после наступления напоминания

let state=loadState();
let tab='today';
let editing=null;
let calMonth=(()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),1).getTime()})();
let selDay=null;
let search='';
let alarmQueue=[],currentAlarm=null;
let lastDayKey=new Date().toDateString();

function loadState(){
  try{
    const raw=JSON.parse(localStorage.getItem(KEY));
    if(raw&&Array.isArray(raw.events)){
      return {events:raw.events,snoozes:raw.snoozes||[],settings:Object.assign({},DEF,raw.settings||{})};
    }
  }catch(e){}
  return {events:[],snoozes:[],settings:Object.assign({},DEF)};
}
function saveState(){ try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){} }

/* =========================================================
   УТИЛИТЫ
   ========================================================= */
const $=id=>document.getElementById(id);
const p2=n=>String(n).padStart(2,'0');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function fmtTime(ts){const d=new Date(ts);return p2(d.getHours())+':'+p2(d.getMinutes());}
function fmtDateTime(ts){const d=new Date(ts);return p2(d.getDate())+'.'+p2(d.getMonth()+1)+'.'+d.getFullYear()+' '+p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds());}
function fmtDay(ts){
  const d=new Date(ts),n=new Date();
  const s=x=>new Date(x.getFullYear(),x.getMonth(),x.getDate()).getTime();
  const diff=Math.round((s(d)-s(n))/86400000);
  if(diff===0)return 'сегодня';
  if(diff===1)return 'завтра';
  if(diff===-1)return 'вчера';
  const wd=['вс','пн','вт','ср','чт','пт','сб'][d.getDay()];
  return wd+', '+p2(d.getDate())+'.'+p2(d.getMonth()+1);
}
function fmtDur(ms){
  const neg=ms<0; ms=Math.abs(ms);
  const t=Math.floor(ms/1000),d=Math.floor(t/86400),h=Math.floor(t%86400/3600),m=Math.floor(t%3600/60),s=t%60;
  let out;
  if(d>0)out=d+' д '+h+' ч '+m+' м';
  else if(h>0)out=h+' ч '+m+' м '+p2(s)+' с';
  else if(m>0)out=m+' м '+p2(s)+' с';
  else out=s+' с';
  return (neg?'-':'')+out;
}
function secLabel(s){
  if(s>=2592000&&s%2592000===0)return (s/2592000)+' мес';
  if(s>=604800&&s%604800===0)return (s/604800)+' нед';
  if(s>=86400&&s%86400===0)return (s/86400)+' дн';
  if(s>=3600&&s%3600===0)return (s/3600)+' ч';
  if(s>=60&&s%60===0)return (s/60)+' мин';
  return s+' сек';
}
function toLocalInput(ts){const d=new Date(ts);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())+'T'+p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds());}
function fromLocalInput(v){if(!v)return null;const t=new Date(v).getTime();return isNaN(t)?null:t;}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('on');clearTimeout(t._tm);t._tm=setTimeout(()=>t.classList.remove('on'),2200);}

/* =========================================================
   ПОВТОРЫ / ВХОЖДЕНИЯ
   ========================================================= */
function stepDate(d,rep){
  if(rep==='daily')d.setDate(d.getDate()+1);
  else if(rep==='weekly')d.setDate(d.getDate()+7);
  else if(rep==='monthly')d.setMonth(d.getMonth()+1);
  else d.setFullYear(d.getFullYear()+1);
}
function nextOcc(ev,from){
  if(!ev.repeat||ev.repeat==='none')return ev.ts;
  if(ev.ts>=from)return ev.ts;
  const cur=new Date(ev.ts); let g=0;
  while(cur.getTime()<from&&g++<5000)stepDate(cur,ev.repeat);
  return cur.getTime();
}
function latestOcc(ev,limit){
  if(!ev.repeat||ev.repeat==='none')return ev.ts<=limit?ev.ts:null;
  if(ev.ts>limit)return null;
  const cur=new Date(ev.ts); let g=0;
  while(g++<5000){
    const nx=new Date(cur.getTime()); stepDate(nx,ev.repeat);
    if(nx.getTime()>limit)break;
    cur.setTime(nx.getTime());
  }
  return cur.getTime();
}
function occsInRange(ev,a,b){
  const out=[];
  if(!ev.repeat||ev.repeat==='none'){ if(ev.ts>=a&&ev.ts<b)out.push(ev.ts); return out; }
  const cur=new Date(ev.ts); let g=0;
  while(cur.getTime()<a&&g++<5000)stepDate(cur,ev.repeat);
  let g2=0;
  while(cur.getTime()<b&&g2++<400){ if(cur.getTime()>=a)out.push(cur.getTime()); stepDate(cur,ev.repeat); }
  return out;
}

/* =========================================================
   НАПОМИНАНИЯ
   ========================================================= */
function remTarget(ev,r,now){
  if(r.kind==='abs')return r.ts;
  const occ=latestOcc(ev,now+r.sec*1000);
  if(occ==null)return null;
  return occ-r.sec*1000;
}
function remKey(ev,r,idx,now){
  if(r.kind==='abs')return 'a'+idx+':'+r.ts;
  const occ=latestOcc(ev,now+r.sec*1000);
  return 'r'+idx+':'+occ;
}
function remLabel(r){ return r.kind==='abs' ? '⏰ '+fmtDateTime(r.ts) : '⏳ за '+secLabel(r.sec); }

/* =========================================================
   ЗВУК
   ========================================================= */
let audioCtx=null,siren=null;
function unlockAudio(){
  try{
    if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    audioCtx.resume();
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.frequency.value=880;g.gain.value=0.0001;
    o.connect(g);g.connect(audioCtx.destination);
    g.gain.exponentialRampToValueAtTime(0.12,audioCtx.currentTime+0.03);
    g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+0.25);
    o.start();o.stop(audioCtx.currentTime+0.3);
    state.settings.sound=true;saveState();
    toast('Звук включён 🔊');
  }catch(e){toast('Не удалось включить звук');}
}
function startSiren(){
  if(!state.settings.sound)return;
  try{
    if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended')audioCtx.resume();
    stopSiren();
    const o=audioCtx.createOscillator(),g=audioCtx.createGain(),lfo=audioCtx.createOscillator(),lg=audioCtx.createGain();
    o.type='sawtooth';o.frequency.value=820;
    lfo.type='sine';lfo.frequency.value=2.6;lg.gain.value=280;
    lfo.connect(lg);lg.connect(o.frequency);
    g.gain.value=0.0001;
    g.gain.exponentialRampToValueAtTime(0.16,audioCtx.currentTime+0.08);
    o.connect(g);g.connect(audioCtx.destination);
    o.start();lfo.start();
    siren={o,g,lfo};
  }catch(e){}
}
function stopSiren(){
  if(!siren||!audioCtx)return;
  try{
    const {o,g,lfo}=siren;
    g.gain.cancelScheduledValues(audioCtx.currentTime);
    g.gain.setTargetAtTime(0.0001,audioCtx.currentTime,0.05);
    setTimeout(()=>{try{o.stop();lfo.stop();}catch(e){}},250);
  }catch(e){}
  siren=null;
}

/* =========================================================
   ТРЕВОГА
   ========================================================= */
function queueAlarm(item){
  alarmQueue.push(item);
  if(!currentAlarm)showNextAlarm();
}
function showNextAlarm(){
  if(!alarmQueue.length){
    currentAlarm=null;
    $('alarm').classList.remove('on');
    stopSiren();
    return;
  }
  currentAlarm=alarmQueue.shift();
  $('alarmTitle').textContent=currentAlarm.title;
  $('alarmWhen').textContent=currentAlarm.sub+' · '+fmtDateTime(currentAlarm.when);
  $('alarm').classList.add('on');
  startSiren();
  notifySystem(currentAlarm);
}
function dismissAlarm(snoozeMin){
  if(snoozeMin>0&&currentAlarm){
    state.snoozes.push({id:uid(),ts:Date.now()+snoozeMin*60000,title:currentAlarm.title,sub:'отложено'});
    saveState();
  }
  stopSiren();
  $('alarm').classList.remove('on');
  currentAlarm=null;
  setTimeout(showNextAlarm,250);
}
function testAlarm(){
  queueAlarm({title:'ПРОВЕРКА ТРЕВОГИ',sub:'тестовое оповещение',when:Date.now()});
}
async function notifySystem(item){
  try{
    if(!('Notification' in window)||Notification.permission!=='granted')return;
    const reg=await navigator.serviceWorker.ready;
    reg.showNotification('⚠️ '+item.title,{
      body:item.sub+' · '+fmtDateTime(item.when),
      tag:'alarm-'+Date.now(),
      requireInteraction:true,
      silent:false,
      icon:'icon-180.png',
      badge:'icon-180.png'
    });
  }catch(e){}
}

/* =========================================================

   ========================================================= */
function checkReminders(now){
  let changed=false;
  for(const ev of state.events){
    if(ev.done)continue;
    ev.fired=ev.fired||[];
    ev.reminders=ev.reminders||[];
    ev.reminders.forEach((r,idx)=>{
      const target=remTarget(ev,r,now);
      if(target==null)return;
      if(target>now)return;
      if(now-target>FIRE_WINDOW)return;
      const key=remKey(ev,r,idx,now);
      if(ev.fired.indexOf(key)>=0)return;
      ev.fired.push(key);
      if(ev.fired.length>200)ev.fired=ev.fired.slice(-200);
      changed=true;
      queueAlarm({title:ev.title||'Событие',sub:remLabel(r),when:target});
    });
  }
  if(changed)saveState();
}
function checkSnoozes(now){
  let changed=false;
  state.snoozes=state.snoozes.filter(s=>{
    if(s.ts<=now){ queueAlarm({title:s.title,sub:s.sub||'отложено',when:s.ts}); changed=true; return false; }
    return true;
  });
  if(changed)saveState();
}

function cardHTML(o,i){
  const ev=o.ev,ts=o.ts,diff=ts-Date.now();
  return `<div class="card glass tap" data-open="${esc(ev.id)}" style="animation-delay:${Math.min(i*45,450)}ms">
    <div class="dot" style="background:${ev.color};box-shadow:0 0 14px ${ev.color}"></div>
    <div class="grow">
      <div class="ctitle">${esc(ev.title)}</div>
      <div class="csub">${fmtDay(ts)} · ${fmtTime(ts)}${ev.repeat!=='none'?' · 🔁':''}${ev.reminders&&ev.reminders.length?' · 🔔'+ev.reminders.length:''}</div>
    </div>
    <div class="cd ${diff<0?'neg':''}" data-cd="${ts}">${diff<0?'прошло':'через'} ${fmtDur(diff)}</div>
  </div>`;
}

function renderToday(){
  const now=Date.now();
  const all=state.events.filter(e=>!e.done).map(e=>({ev:e,ts:nextOcc(e,now)}));
  const future=all.filter(o=>o.ts>=now).sort((a,b)=>a.ts-b.ts);
  const past=all.filter(o=>o.ts<now).sort((a,b)=>b.ts-a.ts);
  let h='';

  if(future.length){
    const n=future[0],diff=n.ts-now;
    h+=`<div class="hero glass">
      <div class="lbl"><span class="pulse"></span>Следующее событие</div>
      <div class="big" data-cd="${n.ts}">${fmtDur(diff)}</div>
      <div class="ttl">${esc(n.ev.title)}</div>
      <div class="meta">${fmtDay(n.ts)} в ${fmtTime(n.ts)}${n.ev.repeat!=='none'?' · повтор':''}</div>
    </div>`;
  } else {
    h+=`<div class="hero glass">
      <div class="lbl">Свободно</div>
      <div class="big">0 с</div>
      <div class="ttl">Нет предстоящих событий</div>
      <div class="meta">Нажми ＋ чтобы добавить</div>
    </div>`;
  }

  const todays=future.filter(o=>fmtDay(o.ts)==='сегодня');
  h+='<div class="sect">Сегодня</div>';
  h+=todays.length?todays.map(cardHTML).join(''):'<div class="empty">На сегодня пусто ✨</div>';

  const soon=future.filter(o=>fmtDay(o.ts)!=='сегодня').slice(0,6);
  if(soon.length){
    h+='<div class="sect">Скоро</div>';
    h+=soon.map(cardHTML).join('');
  }
  if(past.length){
    h+='<div class="sect">Просрочено / прошло</div>';
    h+=past.slice(0,8).map(cardHTML).join('');
  }
  return h;
}

function renderCal(){
  const base=new Date(calMonth),y=base.getFullYear(),m=base.getMonth();
  const first=new Date(y,m,1);
  const startWd=(first.getDay()+6)%7;
  const daysInMonth=new Date(y,m+1,0).getDate();
  const a=new Date(y,m,1).getTime(),b=new Date(y,m+1,1).getTime();
  const marks={};
  state.events.forEach(ev=>{
    occsInRange(ev,a,b).forEach(ts=>{
      const d=new Date(ts).getDate();
      (marks[d]=marks[d]||[]).push(ev.color);
    });
  });
  const todayD=new Date();
  const isThisMonth=todayD.getFullYear()===y&&todayD.getMonth()===m;

  let h=`<div class="calhead glass">
    <button class="mini" onclick="calShift(-1)">‹</button>
    <div class="m">${base.toLocaleDateString('ru-RU',{month:'long',year:'numeric'})}</div>
    <button class="mini" onclick="calShift(1)">›</button>
  </div><div class="calgrid">`;
  ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].forEach(w=>h+=`<div class="wd">${w}</div>`);
  for(let i=0;i<startWd;i++)h+='<div></div>';
  for(let d=1;d<=daysInMonth;d++){
    const cls=['day'];
    if(isThisMonth&&todayD.getDate()===d)cls.push('today');
    if(selDay===d)cls.push('sel');
    const ds=marks[d]||[];
    h+=`<div class="${cls.join(' ')}" onclick="pickDay(${d})">${d}<div class="dots">${
      ds.slice(0,3).map(c=>`<i style="background:${c}"></i>`).join('')
    }</div></div>`;
  }
  h+='</div>';

  if(selDay){
    const dayA=new Date(y,m,selDay).getTime(),dayB=dayA+86400000;
    const list=[];
    state.events.forEach(ev=>{
      occsInRange(ev,dayA,dayB).forEach(ts=>list.push({ev,ts}));
    });
    list.sort((x,y2)=>x.ts-y2.ts);
    h+=`<div class="sect">${selDay} ${base.toLocaleDateString('ru-RU',{month:'long'})}</div>`;
    h+=list.length?list.map(cardHTML).join(''):'<div class="empty">В этот день ничего нет</div>';
  } else {
    const now=Date.now();
    const list=state.events.map(e=>({ev:e,ts:nextOcc(e,now)})).filter(o=>o.ts>=now).sort((x,y2)=>x.ts-y2.ts).slice(0,5);
    h+='<div class="sect">Ближайшее</div>';
    h+=list.length?list.map(cardHTML).join(''):'<div class="empty">Пусто</div>';
  }
  return h;
}
function calShift(n){const d=new Date(calMonth);d.setMonth(d.getMonth()+n);calMonth=d.getTime();selDay=null;render();}
function pickDay(d){selDay=selDay===d?null:d;render(true);}

    </div>
    <div id="f-remlist"></div>
    <div class="label">Заметки</div>
    <textarea class="field" id="f-notes" rows="3" placeholder="Детали, ссылки, мысли..." style="margin-bottom:14px">${esc(editing.notes)}</textarea>
    <div class="row">
      <button class="btn primary" style="flex:2" onclick="saveEditor()">Сохранить</button>
      ${isNew?'':'<button class="btn danger" style="flex:1" onclick="deleteEvent()">Удалить</button>'}
    </div>
  `;
  renderRemList();
  $('sheetwrap').classList.add('open');
}
function closeSheet(){ $('sheetwrap').classList.remove('open'); editing=null; }
function pickColor(c){ editing.color=c; document.querySelectorAll('#f-colors .chip').forEach(el=>el.classList.toggle('on',el.style.background===c||el.getAttribute('style').includes(c))); renderRemList(); }
function togglePreset(sec){
  const i=editing.reminders.findIndex(r=>r.kind==='rel'&&r.sec===sec);
  if(i>=0)editing.reminders.splice(i,1); else editing.reminders.push({kind:'rel',sec});
  document.querySelectorAll('#f-presets .chip').forEach(el=>{
    el.classList.toggle('on',editing.reminders.some(r=>r.kind==='rel'&&r.sec===sec&&el.textContent.trim()===secLabel(sec))||false);
  });
  // проще перерисовать пресеты
  document.getElementById('f-presets').innerHTML=PRESETS.map(p=>
    `<div class="chip ${editing.reminders.some(r=>r.kind==='rel'&&r.sec===p.s)?'on':''}" onclick="togglePreset(${p.s})">${p.l}</div>`).join('');
  renderRemList();
}
function addCustomRem(){
  const n=parseFloat($('f-cnum').value);
  const u=parseInt($('f-cunit').value,10);
  if(!n||n<=0){toast('Введи число');return;}
  editing.reminders.push({kind:'rel',sec:Math.round(n*u)});
  renderRemList();
}
function addAbsRem(){
  const ts=fromLocalInput($('f-abs').value);
  if(!ts){toast('Выбери дату и время');return;}
  editing.reminders.push({kind:'abs',ts});
  $('f-abs').value='';
  renderRemList();
}
function delRem(i){ editing.reminders.splice(i,1); renderRemList();
  document.getElementById('f-presets').innerHTML=PRESETS.map(p=>
    `<div class="chip ${editing.reminders.some(r=>r.kind==='rel'&&r.sec===p.s)?'on':''}" onclick="togglePreset(${p.s})">${p.l}</div>`).join('');
}
function renderRemList(){
  const box=$('f-remlist'); if(!box)return;
  if(!editing.reminders.length){ box.innerHTML='<div class="hint" style="margin-bottom:10px">Пока нет напоминаний — событие просто будет в списке</div>'; return; }
  box.innerHTML=editing.reminders.map((r,i)=>
    `<div class="remrow glass"><span>${r.kind==='abs'?'⏰ '+fmtDateTime(r.ts):'⏳ за '+secLabel(r.sec)}</span>
    <button class="mini" onclick="delRem(${i})">✕</button></div>`).join('');
}

function saveEditor(){
  const title=$('f-title').value.trim();
  const ts=fromLocalInput($('f-ts').value);
  if(ts==null){toast('Укажи дату и время');return;}
  editing.title=title||'Без названия';
  editing.ts=ts;
  editing.notes=$('f-notes').value;
  editing.repeat=$('f-repeat').value;
  const now=Date.now();
  // помечаем уже прошедшие напоминания, чтобы не сработали сразу
  editing.fired=editing.fired||[];
  editing.reminders.forEach((r,idx)=>{
    const t=remTarget(editing,r,now);
    if(t!=null&&t<now-60000){
      const k=remKey(editing,r,idx,now);
      if(editing.fired.indexOf(k)<0)editing.fired.push(k);
    }
  });
  const i=state.events.findIndex(e=>e.id===editing.id);
  if(i>=0)state.events[i]=editing; else state.events.push(editing);
  saveState();
  scheduleNtfy(editing);
  closeSheet();
  render();
  toast('Сохранено ✓');
}
function deleteEvent(){
  if(!editing)return;
  state.events=state.events.filter(e=>e.id!==editing.id);
  saveState(); closeSheet(); render(); toast('Удалено');
}

/* =========================================================
   NTFY
   ========================================================= */
function saveNtfy(){
  state.settings.ntfy=$('s-ntfy').value.trim().replace(/[^a-zA-Z0-9_\-]/g,'');
  saveState(); toast('Топик сохранён');
  render(true);
}
async function ntfySend(title,message,atTs){
  const topic=state.settings.ntfy.trim();
  if(!topic)return;
  const delay=Math.max(0,Math.round((atTs-Date.now())/1000));
  try{
    await fetch('https://ntfy.sh',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        topic:topic, title:title, message:message,
        priority:5, tags:['warning'], delay:delay||undefined
      })
    });
    return true;
  }catch(e){ return false; }
}
async function testNtfy(){
  if(!state.settings.ntfy){toast('Сначала впиши топик');return;}
  toast('Отправляю...');
  const ok=await ntfySend('⚠️ Тест дневника','Если ты это видишь — пуш работает!',Date.now()+3000);
  toast(ok?'Отправлено ✓ (проверь ntfy)':'Ошибка. Проверь топик и интернет');
}
function scheduleNtfy(ev){
  if(!state.settings.ntfy)return;
  const now=Date.now();
  ev.reminders.forEach(r=>{
    const t=remTarget(ev,r,now);
    if(t&&t>now+5000){
      ntfySend('⚠️ '+ev.title, remLabel(r)+' · '+fmtDateTime(t), t);
    }
  });
}

/* =========================================================
   ЭКСПОРТ / ИМПОРТ
   ========================================================= */
function icsEsc(s){return String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');}
function icsDate(ts){return new Date(ts).toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';}
function exportICS(){
  const now=Date.now();
  let out=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//GlassDiary//RU','CALSCALE:GREGORIAN'];
  state.events.forEach(ev=>{
    const end=ev.ts+3600000;
    out.push('BEGIN:VEVENT');
    out.push('UID:'+ev.id+'@glassdiary');
    out.push('DTSTAMP:'+icsDate(now));
    out.push('DTSTART:'+icsDate(ev.ts));
    out.push('DTEND:'+icsDate(end));
    out.push('SUMMARY:'+icsEsc(ev.title||'Событие'));
    if(ev.notes)out.push('DESCRIPTION:'+icsEsc(ev.notes));
    if(ev.repeat==='daily')out.push('RRULE:FREQ=DAILY');
    if(ev.repeat==='weekly')out.push('RRULE:FREQ=WEEKLY');
    if(ev.repeat==='monthly')out.push('RRULE:FREQ=MONTHLY');
    if(ev.repeat==='yearly')out.push('RRULE:FREQ=YEARLY');
    (ev.reminders||[]).forEach(r=>{
      out.push('BEGIN:VALARM');
      if(r.kind==='abs') out.push('TRIGGER;VALUE=DATE-TIME:'+icsDate(r.ts));
      else out.push('TRIGGER:-PT'+r.sec+'S');
      out.push('ACTION:DISPLAY');
      out.push('DESCRIPTION:'+icsEsc(ev.title||'Событие'));
      out.push('END:VALARM');
    });
    out.push('END:VEVENT');
  });
  out.push('END:VCALENDAR');
  download('dnevnik.ics',out.join('\r\n'),'text/calendar');
  toast('Файл .ics скачан');
}
function exportJSON(){
  download('dnevnik-backup.json',JSON.stringify(state,null,2),'application/json');
  toast('Бэкап скачан');
}
function importJSON(inp){
  const f=inp.files&&inp.files[0]; if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const d=JSON.parse(rd.result);
      if(d&&Array.isArray(d.events)){state=Object.assign({},state,d);saveState();render();toast('Импортировано ✓');}
      else toast('Неверный файл');
    }catch(e){toast('Ошибка чтения');}
  };
  rd.readAsText(f);
  inp.value='';
}
function download(name,content,type){
  const b=new Blob([content],{type:type+';charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(b); a.download=name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
}
function resetAll(){
  if(!confirm('Удалить ВСЕ события? Это необратимо.'))return;
  state.events=[]; state.snoozes=[]; saveState(); render(); toast('Всё удалено');
}
function setTheme(t){
  state.settings.theme=t; saveState();
  document.documentElement.setAttribute('data-theme',t);
  render(true);
}
function toggleSound(){
  state.settings.sound=!state.settings.sound; saveState();
  if(state.settings.sound)unlockAudio();
  render(true);
}

/* =========================================================
   УВЕДОМЛЕНИЯ
   ========================================================= */
async function askNotify(){
  if(!('Notification' in window)){
    toast('В Safari нет Notification API. Добавь сайт на экран «Домой»');
    return;
  }
  if(Notification.permission==='granted'){ toast('Уведомления уже разрешены ✓'); return; }
  try{
    const p=await Notification.requestPermission();
    if(p==='granted'){
      toast('Уведомления включены 🔔');
      const reg=await navigator.serviceWorker.ready;
      reg.showNotification('⚠️ Дневник подключён',{body:'Теперь я смогу предупреждать тебя о событиях',icon:'icon-180.png'});
    } else toast('Разрешение не выдано');
  }catch(e){ toast('Ошибка: '+e.message); }
  updateBell(); render(true);
}

/* =========================================================
   ЦИКЛ
   ========================================================= */
function tickUI(){
  const now=Date.now();
  document.querySelectorAll('[data-cd]').forEach(el=>{
    const t=+el.dataset.cd, diff=t-now;
    el.textContent=diff>0?fmtDur(diff):'сейчас';
    if(el.classList.contains('big')||el.classList.contains('cd'))el.classList.toggle('neg',diff<0);
  });
}
function tick(){
  const now=Date.now();
  tickUI();
  checkReminders(now);
  checkSnoozes(now);
  const dk=new Date().toDateString();
  if(dk!==lastDayKey){ lastDayKey=dk; render(true); }
}

/* =========================================================
   СТАРТ
   ========================================================= */
function init(){
  document.documentElement.setAttribute('data-theme',state.settings.theme||'dark');
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
  document.querySelectorAll('.tab').forEach(b=>{
    b.addEventListener('click',()=>{
      tab=b.dataset.tab; selDay=null; render();
      if(tab==='list')setTimeout(()=>{const s=$('search');if(s)s.blur();},50);
    });
  });
  $('main').addEventListener('click',e=>{
    const card=e.target.closest('[data-open]');
    if(card){
      const ev=state.events.find(x=>x.id===card.dataset.open);
      if(ev)openEditor(ev);
    }
  });
  render();
  setInterval(tick,500);
  setInterval(()=>{ if(tab==='today'||tab==='cal') render(true); },60000);
}
init();
</script>
