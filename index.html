<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SYSTEM">

<title>SYSTEM // TERMINAL</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{margin:0;height:100%;overflow:hidden}
:root{
  --bg:#050805;
  --panel:rgba(10,15,10,0.6);
  --txt:#e0ffe0;
  --dim:rgba(224,255,224,0.5);
  --dim2:rgba(224,255,224,0.3);
  --accent:#00ff66;
  --accent-dark:#004d1a;
  --danger:#ff3b30;
  --warn:#ffb000;
  --border:rgba(0,255,102,0.3);
  --border-focus:rgba(0,255,102,0.8);
  color-scheme:dark;
}
body{
  font-family:'SF Mono',-apple-system,BlinkMacSystemFont,monospace;
  color:var(--txt);background:var(--bg);display:flex;flex-direction:column;height:100dvh;
  user-select:none;-webkit-user-select:none;-webkit-font-smoothing:antialiased;
  background-image:
    linear-gradient(rgba(0,255,102,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,255,102,0.04) 1px, transparent 1px);
  background-size: 30px 30px;
}
#bg{position:fixed;inset:0;z-index:-3;background:radial-gradient(120% 80% at 50% 0%,#0a1a0f 0%,#050805 45%,#000000 100%)}
.scanline{position:fixed;top:0;left:0;right:0;height:4px;background:rgba(0,255,102,0.1);z-index:-1;animation:scan 4s linear infinite;pointer-events:none;box-shadow:0 0 10px rgba(0,255,102,0.2)}
@keyframes scan{0%{top:-10px;opacity:0}10%{opacity:1}90%{opacity:1}100%{top:100%;opacity:0}}

.glass{
  position:relative;
  background:var(--panel);
  -webkit-backdrop-filter:blur(16px) saturate(140%);
  backdrop-filter:blur(16px) saturate(140%);
  border:1px solid var(--border);
  box-shadow:0 4px 24px rgba(0,0,0,0.8),inset 0 0 0 1px rgba(0,255,102,0.1);
  border-radius:12px;
  overflow:hidden;
}
.glass::after{
  content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(120deg,rgba(0,255,102,0.08) 0%,transparent 40%);
}

.tap{transition:transform .15s ease,filter .2s}
.tap:active{transform:scale(.97);filter:brightness(1.3)}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;
padding:calc(12px + env(safe-area-inset-top)) 16px 10px;z-index:20;
border-bottom:1px solid var(--border);background:rgba(5,8,5,0.8);backdrop-filter:blur(10px)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;font-size:18px;
  border:1px solid var(--accent);color:var(--accent);box-shadow:0 0 12px rgba(0,255,102,0.3)}
.h1{font-size:20px;font-weight:700;letter-spacing:1px;color:var(--accent);text-shadow:0 0 8px rgba(0,255,102,0.5);line-height:1.1}
.sub{font-size:11px;color:var(--dim);margin-top:2px;letter-spacing:0.5px;text-transform:uppercase}
.iconbtn{width:40px;height:40px;border-radius:8px;border:1px solid var(--border);
  background:rgba(0,0,0,0.5);display:grid;place-items:center;font-size:16px;
  color:var(--accent);cursor:pointer;flex:none;position:relative;box-shadow:inset 0 0 10px rgba(0,255,102,0.1)}
.iconbtn.dot::after{content:'';position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;
  background:var(--danger);box-shadow:0 0 8px var(--danger);animation:pulseDot 1.5s infinite}
@keyframes pulseDot{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}

main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 180px;position:relative;z-index:1;
  overscroll-behavior-y:contain;scrollbar-width:none}
main::-webkit-scrollbar{display:none}
.view{animation:viewIn .3s ease-out both}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.hero{padding:20px;margin-bottom:16px;position:relative;border-left:3px solid var(--accent)}
.hero .lbl{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:8px}
.hero .big{font-size:36px;font-weight:800;letter-spacing:-1px;margin:4px 0;color:#fff;text-shadow:0 0 15px rgba(255,255,255,0.3)}
.hero .big.neg{color:var(--danger);text-shadow:0 0 15px rgba(255,59,48,0.5)}
.hero .ttl{font-size:15px;font-weight:600;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--accent)}
.hero .meta{font-size:12px;color:var(--dim);margin-top:4px}

.sect{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);font-weight:700;margin:20px 0 10px;
  display:flex;align-items:center;gap:8px}
.sect::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent)}

.card{padding:14px;display:flex;gap:12px;align-items:center;margin-bottom:8px;
  cursor:pointer;transition:.2s;border-left:2px solid transparent}
.card:active{transform:scale(.98)}
.card.done{opacity:.4}
.card.done .ctitle{text-decoration:line-through;color:var(--dim)}
.card.critical{border-left-color:var(--danger);background:linear-gradient(90deg,rgba(255,59,48,0.1),transparent)}
.card.critical .ctitle{color:var(--danger);text-shadow:0 0 8px rgba(255,59,48,0.4)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;box-shadow:0 0 8px currentColor}
.grow{flex:1;min-width:0}
.ctitle{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.csub{font-size:11px;color:var(--dim);margin-top:4px;display:flex;gap:6px;align-items:center;flex-wrap:nowrap;overflow:hidden}
.cat-pill{font-size:9px;padding:2px 6px;border-radius:4px;font-weight:700;letter-spacing:.5px;border:1px solid currentColor;flex:none}
.cd{font-size:12px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;flex:none;text-align:right}
.cd.neg{color:var(--danger)}
.chk{width:24px;height:24px;border-radius:4px;border:1px solid var(--border);flex:none;
  display:grid;place-items:center;font-size:12px;color:transparent;transition:.2s;background:rgba(0,0,0,0.3);cursor:pointer}
.chk.on{background:var(--accent);border-color:var(--accent);color:#000;box-shadow:0 0 12px rgba(0,255,102,0.5)}
.empty{padding:40px 16px;text-align:center;color:var(--dim);font-size:13px;border:1px dashed var(--border);border-radius:12px;margin-top:10px}

input,select,textarea,button{font-family:inherit;font-size:16px}
.field{width:100%;padding:12px 14px;border-radius:8px;border:1px solid var(--border);
  background:rgba(0,0,0,0.4);color:var(--accent);outline:none;transition:.2s;font-family:monospace}
.field:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(0,255,102,0.2);background:rgba(0,20,0,0.6)}
.field::placeholder{color:var(--dim2)}
.row{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{padding:8px 12px;border-radius:6px;font-size:12px;border:1px solid var(--border);
  background:rgba(0,0,0,0.4);color:var(--dim);transition:.2s;cursor:pointer;font-family:monospace}
.chip.on{background:rgba(0,255,102,0.15);color:var(--accent);border-color:var(--accent);
  box-shadow:0 0 10px rgba(0,255,102,0.2);text-shadow:0 0 5px var(--accent)}
.btn{padding:12px 16px;border-radius:8px;border:1px solid var(--border);cursor:pointer;
  background:rgba(0,0,0,0.5);color:var(--accent);font-weight:700;transition:.15s;
  display:flex;align-items:center;justify-content:center;gap:8px;letter-spacing:0.5px;text-transform:uppercase;font-size:13px}
.btn:active{background:rgba(0,255,102,0.2);box-shadow:0 0 15px rgba(0,255,102,0.4)}
.btn.primary{background:var(--accent);color:#000;border-color:var(--accent);box-shadow:0 0 15px rgba(0,255,102,0.3)}
.btn.primary:active{background:#00cc52}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.danger:active{background:rgba(255,59,48,0.2)}
.btn.small{padding:8px 12px;font-size:11px;border-radius:6px}
.label{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--accent);font-weight:700;margin:16px 0 8px;opacity:0.8}
.hint{font-size:12px;color:var(--dim);line-height:1.5;font-family:-apple-system,sans-serif}
.mini{width:30px;height:30px;border-radius:6px;border:1px solid var(--border);
  background:rgba(0,0,0,0.5);color:var(--accent);display:grid;place-items:center;font-size:14px;cursor:pointer}
.remrow{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;
  border-radius:8px;margin-bottom:6px;font-size:12px;border:1px solid var(--border);background:rgba(0,0,0,0.3)}

.tabbar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));
  display:flex;gap:4px;padding:6px;border-radius:12px;z-index:60;background:rgba(5,8,5,0.9)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;border-radius:8px;
  font-size:9px;font-weight:700;color:var(--dim);background:transparent;border:none;transition:.2s;cursor:pointer;
  letter-spacing:1px;text-transform:uppercase;font-family:monospace}
.tab .ic{font-size:18px;line-height:1}
.tab.active{color:var(--accent);background:rgba(0,255,102,0.1);box-shadow:inset 0 0 10px rgba(0,255,102,0.2);text-shadow:0 0 8px var(--accent)}

.fab{position:fixed;right:16px;bottom:calc(90px + env(safe-area-inset-bottom));width:56px;height:56px;
  border-radius:12px;border:1px solid var(--accent);font-size:28px;font-weight:300;color:#000;
  background:var(--accent);z-index:61;cursor:pointer;
  box-shadow:0 0 20px rgba(0,255,102,0.5);display:grid;place-items:center;transition:.2s}
.fab:active{transform:scale(.9) rotate(90deg);box-shadow:0 0 30px rgba(0,255,102,0.8)}

.sheetwrap{position:fixed;inset:0;z-index:90;display:flex;align-items:flex-end;
  background:rgba(0,0,0,0.8);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  opacity:0;pointer-events:none;transition:opacity .3s}
.sheetwrap.open{opacity:1;pointer-events:auto}
.sheet{width:100%;max-height:92dvh;overflow-y:auto;border-radius:16px 16px 0 0;
  padding:16px 16px calc(24px + env(safe-area-inset-bottom));
  transform:translateY(100%);transition:transform .3s cubic-bezier(.2,1,.3,1);
  background:#050805;border-top:1px solid var(--accent);
  box-shadow:0 -10px 40px rgba(0,255,102,0.15);scrollbar-width:none}
.sheet::-webkit-scrollbar{display:none}
.sheetwrap.open .sheet{transform:translateY(0)}
.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;border-bottom:1px solid var(--border);padding-bottom:10px}
.sheettitle{font-size:16px;font-weight:700;letter-spacing:1px;color:var(--accent)}
.grab{width:40px;height:4px;border-radius:2px;background:var(--border);margin:0 auto 12px}

#alarm{position:fixed;inset:0;z-index:300;display:none;flex-direction:column;align-items:center;
  justify-content:center;gap:16px;padding:24px;text-align:center;
  background:rgba(20,0,0,0.95);backdrop-filter:blur(10px);border:4px solid var(--danger)}
#alarm.on{display:flex;animation:alarmPulse 1s infinite}
@keyframes alarmPulse{0%,100%{box-shadow:inset 0 0 50px rgba(255,59,48,0.5)}50%{box-shadow:inset 0 0 100px rgba(255,59,48,0.8)}}
#alarm .warn{font-size:80px;line-height:1;animation:warnBounce .5s infinite alternate;color:var(--danger)}
@keyframes warnBounce{from{transform:scale(1)}to{transform:scale(1.15)}}
#alarm .atitle{font-size:24px;font-weight:900;color:#fff;text-shadow:0 0 10px var(--danger);font-family:monospace}
#alarm .awhen{font-size:14px;color:rgba(255,255,255,0.8);font-family:monospace}
#alarm .abtns{display:flex;flex-direction:column;gap:8px;width:100%;max-width:300px;margin-top:16px}
#alarm .abtn{padding:14px;border-radius:8px;border:1px solid var(--danger);font-size:14px;
  font-weight:700;background:rgba(255,59,48,0.1);color:#fff;cursor:pointer;transition:.2s;font-family:monospace;text-transform:uppercase}
#alarm .abtn:active{background:rgba(255,59,48,0.3)}
#alarm .abtn.main{background:var(--danger);color:#fff;box-shadow:0 0 15px rgba(255,59,48,0.6)}

#toast{position:fixed;left:50%;bottom:calc(180px + env(safe-area-inset-bottom));transform:translate(-50%,20px);
  padding:12px 20px;border-radius:8px;font-size:13px;font-weight:700;z-index:400;opacity:0;
  pointer-events:none;transition:.3s;max-width:90vw;text-align:center;font-family:monospace;
  background:rgba(0,0,0,0.9);border:1px solid var(--accent);color:var(--accent);box-shadow:0 0 15px rgba(0,255,102,0.3)}
#toast.on{opacity:1;transform:translate(-50%,0)}

.calhead{display:flex;justify-content:space-between;align-items:center;padding:12px;margin-bottom:12px}
.calhead .m{font-size:15px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--accent)}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{text-align:center;font-size:10px;font-weight:700;color:var(--dim);padding:4px 0;text-transform:uppercase}
.day{aspect-ratio:1;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;font-size:13px;font-weight:600;color:var(--txt);background:rgba(0,255,102,0.05);
  border:1px solid transparent;transition:.2s;cursor:pointer}
.day.today{border-color:var(--dim);color:var(--accent)}
.day.sel{background:var(--accent);color:#000;box-shadow:0 0 10px rgba(0,255,102,0.5)}
.dots{display:flex;gap:2px;height:4px}
.dots i{width:4px;height:4px;border-radius:50%;display:block}

.settingscard{padding:16px;margin-bottom:12px}
.banner{padding:14px;margin-bottom:12px;display:flex;gap:12px;align-items:center;border-left:3px solid var(--border)}
.banner.warn{border-left-color:var(--danger)}
.banner.info{border-left-color:var(--accent)}
.banner.ok{border-left-color:var(--accent);background:rgba(0,255,102,0.05)}
.banner .em{font-size:24px;flex:none}
.banner .bt{flex:1;min-width:0}
.banner .bt b{display:block;font-size:13px;margin-bottom:2px;font-family:monospace;letter-spacing:0.5px}
.banner .bt small{font-size:11px;color:var(--dim);font-weight:500;line-height:1.4;display:block;font-family:-apple-system,sans-serif}

.onboard{padding:16px;margin-bottom:12px}
.onboard .obtitle{font-size:14px;font-weight:700;margin-bottom:12px;color:var(--accent);letter-spacing:1px;text-transform:uppercase}
.obitem{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:6px;
  background:rgba(0,0,0,0.3);margin-bottom:8px;transition:.2s;cursor:pointer;border:1px solid transparent}
.obitem:active{background:rgba(0,255,102,0.1)}
.obitem.done{opacity:.5}
.obitem .obchk{width:20px;height:20px;border-radius:4px;border:1px solid var(--border);
  flex:none;display:grid;place-items:center;font-size:12px;color:transparent;transition:.2s}
.obitem.done .obchk{background:var(--accent);border-color:var(--accent);color:#000}
.obitem .obtxt{flex:1;min-width:0}
.obitem .obtxt b{display:block;font-size:12px;margin-bottom:2px;font-family:monospace}
.obitem .obtxt small{font-size:11px;color:var(--dim);display:block;line-height:1.4;font-family:-apple-system,sans-serif}

.filterbar{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 12px;margin:0 -4px;scrollbar-width:none}
.filterbar::-webkit-scrollbar{display:none}
.fchip{padding:6px 12px;border-radius:6px;font-size:11px;font-weight:700;white-space:nowrap;
  border:1px solid var(--border);background:rgba(0,0,0,0.3);color:var(--dim);cursor:pointer;transition:.2s;text-transform:uppercase;letter-spacing:0.5px}
.fchip.on{background:rgba(0,255,102,0.15);color:var(--accent);border-color:var(--accent)}

.status{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:4px;
  font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;border:1px solid}
.status.ok{background:rgba(0,255,102,0.1);color:var(--accent);border-color:var(--accent)}
.status.bad{background:rgba(255,59,48,0.1);color:var(--danger);border-color:var(--danger)}
.status.warn{background:rgba(255,176,0,0.1);color:var(--warn);border-color:var(--warn)}
</style>
</head>
<body>

<div id="bg"></div>
<div class="scanline"></div>

<header class="topbar">
  <div class="brand">
    <div class="logo glass">⚠</div>
    <div style="min-width:0">
      <div class="h1" id="topTitle">SYSTEM</div>
      <div class="sub" id="topDate">INITIALIZING...</div>
    </div>
  </div>
  <button class="iconbtn glass tap" id="btnBell" onclick="askNotify()">🔔</button>
</header>

<main id="main"></main>
<button class="fab" onclick="openEditor(null)">+</button>

<nav class="tabbar glass">
  <button class="tab active" data-tab="today"><span class="ic">⏱</span><span>Today</span></button>
  <button class="tab" data-tab="list"><span class="ic">📋</span><span>List</span></button>
  <button class="tab" data-tab="cal"><span class="ic">📅</span><span>Grid</span></button>
  <button class="tab" data-tab="set"><span class="ic">⚙</span><span>Conf</span></button>
</nav>

<div class="sheetwrap" id="sheetwrap" onclick="if(event.target===this)closeSheet()">
  <div class="sheet" id="sheet"></div>
</div>

<div id="alarm">
  <div class="warn">⚠</div>
  <div class="atitle" id="alarmTitle">CRITICAL ALERT</div>
  <div class="awhen" id="alarmWhen">—</div>
  <div class="abtns">
    <button class="abtn main" onclick="dismissAlarm(0)">ACKNOWLEDGE</button>
    <button class="abtn" onclick="dismissAlarm(5)">SNOOZE 5 MIN</button>
    <button class="abtn" onclick="dismissAlarm(60)">SNOOZE 1 HOUR</button>
  </div>
</div>

<div id="toast"></div>

<script>
const KEY='glass_diary_v5';
const PRESETS=[
  {l:'5m',s:300},{l:'15m',s:900},{l:'30m',s:1800},
  {l:'1h',s:3600},{l:'2h',s:7200},{l:'6h',s:21600},{l:'12h',s:43200},
  {l:'24h',s:86400},{l:'2d',s:172800},{l:'4d',s:345600},
  {l:'1w',s:604800},{l:'2w',s:1209600},{l:'1mo',s:2592000}
];
const CATS={
  none:{label:'SYS',color:'#8890a8',icon:'•'},
  work:{label:'WRK',color:'#00ff66',icon:'💼'},
  health:{label:'HLT',color:'#00e5ff',icon:'💊'},
  money:{label:'FIN',color:'#ffb000',icon:'💰'},
  personal:{label:'PRS',color:'#b18cff',icon:'🏠'},
  urgent:{label:'!!!',color:'#ff3b30',icon:'🔥'}
};
const COLORS=['#00ff66','#00e5ff','#ff3b30','#ffb000','#b18cff','#ffffff','#8890a8'];
const DEF={ntfy:'',sound:true,theme:'dark',ntfyConfirmed:false};
const FIRE_WINDOW=30*60*1000;
const MISSED_WINDOW=7*24*3600*1000;
const NTFY_HORIZON=14*24*3600*1000;

let state=loadState(),tab='today',editing=null,
    calMonth=(()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),1).getTime()})(),
    selDay=null,search='',filterCat='all',alarmQueue=[],currentAlarm=null,
    lastDayKey=new Date().toDateString(),missedCache=[];

function loadState(){
  try{
    const raw=JSON.parse(localStorage.getItem(KEY));
    if(raw&&Array.isArray(raw.events)){
      raw.events.forEach(ev=>{
        ev.fired=ev.fired||[];ev._scheduled=ev._scheduled||{};
        ev.reminders=(ev.reminders||[]).map(r=>{if(!r.id)r.id=uid();return r;});
      });
      return {events:raw.events,snoozes:raw.snoozes||[],settings:Object.assign({},DEF,raw.settings||{})};

const fmtTime=ts=>{const d=new Date(ts);return p2(d.getHours())+':'+p2(d.getMinutes());};
const fmtDateTime=ts=>{const d=new Date(ts);return p2(d.getDate())+'.'+p2(d.getMonth()+1)+'.'+d.getFullYear()+' '+p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds());};
function fmtDay(ts){
  const d=new Date(ts),n=new Date();
  const s=x=>new Date(x.getFullYear(),x.getMonth(),x.getDate()).getTime();
  const diff=Math.round((s(d)-s(n))/86400000);
  if(diff===0)return 'TODAY';if(diff===1)return 'TMRW';if(diff===-1)return 'YDAY';
  const wd=['SUN','MON','TUE','WED','THU','FRI','SAT'][d.getDay()];
  return wd+' '+p2(d.getDate())+'.'+p2(d.getMonth()+1);
}
function fmtDur(ms){
  const neg=ms<0;ms=Math.abs(ms);
  const t=Math.floor(ms/1000),d=Math.floor(t/86400),h=Math.floor(t%86400/3600),m=Math.floor(t%3600/60),s=t%60;
  let out;
  if(d>0)out=d+'d '+h+'h '+m+'m';
  else if(h>0)out=h+'h '+m+'m';
  else if(m>0)out=m+'m '+p2(s)+'s';
  else out=s+'s';
  return (neg?'-':'')+out;
}
function secLabel(s){
  if(s>=2592000&&s%2592000===0)return (s/2592000)+'mo';
  if(s>=604800&&s%604800===0)return (s/604800)+'w';
  if(s>=86400&&s%86400===0)return (s/86400)+'d';
  if(s>=3600&&s%3600===0)return (s/3600)+'h';
  if(s>=60&&s%60===0)return (s/60)+'m';
  return s+'s';
}

function stepDate(d,rep){
  if(rep==='daily')d.setDate(d.getDate()+1);
  else if(rep==='weekly')d.setDate(d.getDate()+7);
  else if(rep==='monthly'){
    const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+1);
    const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
    d.setDate(Math.min(day,last));
  }
  else if(rep==='yearly'){
    const month=d.getMonth(),day=d.getDate();d.setDate(1);d.setFullYear(d.getFullYear()+1);
    const last=new Date(d.getFullYear(),month+1,0).getDate();
    d.setMonth(month);d.setDate(Math.min(day,last));
  }
}
function nextOcc(ev,from){
  if(!ev.repeat||ev.repeat==='none')return ev.ts;
  if(ev.ts>=from)return ev.ts;
  const cur=new Date(ev.ts);let g=0;
  while(cur.getTime()<from&&g++<5000)stepDate(cur,ev.repeat);
  return cur.getTime();
}
function latestOcc(ev,limit){
  if(!ev.repeat||ev.repeat==='none')return ev.ts<=limit?ev.ts:null;
  if(ev.ts>limit)return null;
  const cur=new Date(ev.ts);let g=0;
  while(g++<5000){const nx=new Date(cur.getTime());stepDate(nx,ev.repeat);if(nx.getTime()>limit)break;cur.setTime(nx.getTime());}
  return cur.getTime();
}
function occsInRange(ev,a,b){
  const out=[];
  if(!ev.repeat||ev.repeat==='none'){if(ev.ts>=a&&ev.ts<b)out.push(ev.ts);return out;}
  const cur=new Date(ev.ts);let g=0;
  while(cur.getTime()<a&&g++<5000)stepDate(cur,ev.repeat);
  let g2=0;
  while(cur.getTime()<b&&g2++<400){if(cur.getTime()>=a)out.push(cur.getTime());stepDate(cur,ev.repeat);}
  return out;
}
function occsForward(ev,from,to){
  const out=[];
  if(!ev.repeat||ev.repeat==='none'){if(ev.ts>=from&&ev.ts<=to)out.push(ev.ts);return out;}
  const cur=new Date(ev.ts);let g=0;
  while(cur.getTime()<from&&g++<5000)stepDate(cur,ev.repeat);
  let g2=0;
  while(cur.getTime()<=to&&g2++<400){out.push(cur.getTime());stepDate(cur,ev.repeat);}
  return out;
}

function remTarget(ev,r,now){
  if(r.kind==='abs')return r.ts;
  const occ=latestOcc(ev,now+r.sec*1000);
  return occ==null?null:occ-r.sec*1000;
}
function remKey(ev,r,now){
  if(r.kind==='abs')return r.id+'@abs';
  const occ=latestOcc(ev,now+r.sec*1000);
  return r.id+'@'+occ;
}
function remLabel(r){return r.kind==='abs'?'ALARM '+fmtDateTime(r.ts):'T-'+secLabel(r.sec);}
function getMissed(now){
  const out=[];
  for(const ev of state.events){
    if(ev.done)continue;
    for(const r of ev.reminders){
      const target=remTarget(ev,r,now);
      if(target==null)continue;
      if(target<now-60000&&target>now-MISSED_WINDOW){
        const key=remKey(ev,r,now);
        if(!ev.fired.includes(key))out.push({ev,r,target,key});
      }
    }
  }
  return out;
}
function checkReminders(now){
  let changed=false;
  const seen=new Set();
  for(const ev of state.events){
    if(ev.done)continue;
    for(const r of ev.reminders){
      const target=remTarget(ev,r,now);
      if(target==null||target>now)continue;
      const key=remKey(ev,r,now);
      if(ev.fired.includes(key))continue;
      const age=now-target;
      if(age>FIRE_WINDOW){ev.fired.push(key);changed=true;continue;}
      ev.fired.push(key);changed=true;
      if(ev.fired.length>300)ev.fired=ev.fired.slice(-300);
      const dedup=`${ev.title}|${Math.floor(target/1000)}`;
      if(seen.has(dedup))continue;
      seen.add(dedup);
      queueAlarm({title:ev.title||'EVENT',sub:remLabel(r),when:target,critical:ev.priority==='critical'});
    }
  }
  if(changed)saveState();
}
function checkSnoozes(now){
  let changed=false;
  state.snoozes=state.snoozes.filter(s=>{
    if(s.ts<=now){queueAlarm({title:s.title,sub:s.sub||'SNOOZE',when:s.ts,critical:false});changed=true;return false;}
    return true;
  });
  if(changed)saveState();
}

let audioCtx=null,siren=null;
function unlockAudio(){
  try{
    if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    audioCtx.resume();
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type='square';o.frequency.value=440;g.gain.value=0.0001;o.connect(g);g.connect(audioCtx.destination);
    g.gain.exponentialRampToValueAtTime(0.1,audioCtx.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+0.2);
    o.start();o.stop(audioCtx.currentTime+0.25);
    state.settings.sound=true;saveState();toast('AUDIO: ENABLED');
  }catch(e){toast('AUDIO: FAILED');}
}
function startSiren(){
  if(!state.settings.sound)return;
  try{
    if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended')audioCtx.resume();
    stopSiren();
    const o=audioCtx.createOscillator(),g=audioCtx.createGain(),lfo=audioCtx.createOscillator(),lg=audioCtx.createGain();
    o.type='square';o.frequency.value=880;lfo.type='square';lfo.frequency.value=4;lg.gain.value=200;
    lfo.connect(lg);lg.connect(o.frequency);g.gain.value=0.0001;
    g.gain.exponentialRampToValueAtTime(0.08,audioCtx.currentTime+0.05);
    o.connect(g);g.connect(audioCtx.destination);o.start();lfo.start();
    siren={o,g,lfo};
  }catch(e){}
}
function stopSiren(){
  if(!siren||!audioCtx)return;
  try{const{o,g,lfo}=siren;g.gain.cancelScheduledValues(audioCtx.currentTime);
    g.gain.setTargetAtTime(0.0001,audioCtx.currentTime,0.02);
    setTimeout(()=>{try{o.stop();lfo.stop();}catch(e){}},150);}catch(e){}
  siren=null;
}

// ИСПРАВЛЕНА ОТПРАВКА В NTFY
async function postNtfySchedule(ev,r,target){
  if(!state.settings.ntfy)return false;
  const secs=Math.round((target-Date.now())/1000);
  // Отправляем даже если время уже пришло (мгновенно), убираем блокировку <15 сек
  if(secs<-60)return false; // если событие было больше минуты назад, не шлем (прошлое)
  
  try{
    const res=await fetch('https://ntfy.sh',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        topic:state.settings.ntfy,
        title:'⚠️ '+(ev.title||'EVENT'),
        message:remLabel(r)+'\n'+fmtDateTime(target),
        priority:5,
        tags:['warning','skull'],
        delay:secs>15?secs+'s':undefined,
        // Уникальный ID, чтобы ntfy не блокировал дубликаты
        id:'ev_'+ev.id+'_'+r.id+'_'+Math.floor(target/1000)
      })
    });
    return res.ok;
  }catch(e){return false;}
}

async function scheduleNtfyForEvent(ev){
  if(!state.settings.ntfy||!navigator.onLine)return 0;
  const now=Date.now(),until=now+NTFY_HORIZON;
  const occs=occsForward(ev,now,until);
  let count=0;
  for(const r of ev.reminders){
    for(const occ of occs){
      const target=r.kind==='abs'?r.ts:occ-r.sec*1000;
      if(target<now-60000)continue; // прошедшее не шлем
      const key=r.id+'@'+occ;
      if(ev._scheduled&&ev._scheduled[key])continue;
      const ok=await postNtfySchedule(ev,r,target);
      if(ok){ev._scheduled=ev._scheduled||{};ev._scheduled[key]=1;count++;}
    }
  }
  if(count)saveState();
  return count;
}
async function syncNtfyAll(silent=false){
  if(!state.settings.ntfy){if(!silent)toast('ERR: NO TOPIC');return 0;}
  if(!navigator.onLine){if(!silent)toast('ERR: OFFLINE');return 0;}
  let total=0;
  for(const ev of state.events){
    if(ev.done)continue;
    total+=await scheduleNtfyForEvent(ev);
  }
  if(!silent)toast(total?`SENT: ${total} ALERTS`:'NO NEW ALERTS');
  return total;
}

function icsEsc(s){return String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');}
function icsUTC(ts){return new Date(ts).toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';}
function getTZID(){
  const off=-new Date().getTimezoneOffset();
  const sign=off>=0?'+':'-',abs=Math.abs(off);
  return 'Etc/GMT'+sign+Math.floor(abs/60);
}
function exportICS(){
  const now=Date.now(),tz=getTZID();
  let out=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//SystemTerminal//RU','CALSCALE:GREGORIAN','METHOD:PUBLISH'];
  state.events.forEach(ev=>{
    if(ev.done)return;
    const dur=ev.duration||3600000;
    const dtStart=new Date(ev.ts).toLocaleString('sv-SE').replace(/[-:]/g,'').replace(' ','T');
    const dtEnd=new Date(ev.ts+dur).toLocaleString('sv-SE').replace(/[-:]/g,'').replace(' ','T');
    out.push('BEGIN:VEVENT');
    out.push('UID:'+ev.id+'@system');
    out.push('DTSTAMP:'+icsUTC(now));
    out.push('DTSTART;TZID='+tz+':'+dtStart);
    out.push('DTEND;TZID='+tz+':'+dtEnd);
    out.push('SUMMARY:'+icsEsc(ev.title||'EVENT'));
    if(ev.notes)out.push('DESCRIPTION:'+icsEsc(ev.notes));
    if(ev.repeat==='daily')out.push('RRULE:FREQ=DAILY');
    if(ev.repeat==='weekly')out.push('RRULE:FREQ=WEEKLY');
    if(ev.repeat==='monthly')out.push('RRULE:FREQ=MONTHLY');
    if(ev.repeat==='yearly')out.push('RRULE:FREQ=YEARLY');
    (ev.reminders||[]).forEach(r=>{
      out.push('BEGIN:VALARM');
      if(r.kind==='abs'){
        const delta=Math.round((r.ts-ev.ts)/1000);
        out.push('TRIGGER:'+(delta>=0?'PT'+delta+'S':'-PT'+(-delta)+'S'));
      }else{
        out.push('TRIGGER:-PT'+r.sec+'S');
      }
      out.push('ACTION:DISPLAY');
      out.push('DESCRIPTION:'+icsEsc(ev.title||'EVENT'));
      out.push('END:VALARM');
    });
    out.push('END:VEVENT');
  });
  out.push('END:VCALENDAR');
  download('system_events.ics',out.join('\r\n'),'text/calendar');
  toast('ICS: DOWNLOADED');
}

  h+=`<div class="filterbar">
    <div class="fchip ${filterCat==='all'?'on':''}" onclick="filterCat='all';render()">ALL</div>
    ${Object.entries(CATS).map(([k,c])=>`<div class="fchip ${filterCat===k?'on':''}" onclick="filterCat='${k}';render()">${c.label}</div>`).join('')}
    <div class="fchip ${filterCat==='done'?'on':''}" onclick="filterCat='done';render()">DONE</div>
  </div>`;
  h+='<div id="listbody"></div>';
  setTimeout(renderListOnly,0);
  return h;
}
function renderListOnly(){
  const body=$('listbody');if(!body)return;
  const now=Date.now(),q=search.trim().toLowerCase();
  const matches=e=>{
    if(filterCat==='done')return e.done;
    if(filterCat!=='all'&&e.category!==filterCat)return false;
    if(e.done&&filterCat!=='done')return false;
    return !q||(e.title||'').toLowerCase().includes(q)||(e.notes||'').toLowerCase().includes(q);
  };
  const items=state.events.filter(matches).map(e=>({ev:e,ts:nextOcc(e,now)}));
  const future=items.filter(o=>o.ts>=now).sort((a,b)=>a.ts-b.ts);
  const past=items.filter(o=>o.ts<now).sort((a,b)=>b.ts-a.ts);
  let h='<div class="sect">ACTIVE ('+future.length+')</div>';
  h+=future.length?future.map(cardHTML).join(''):'<div class="empty">EMPTY</div>';
  if(past.length){h+='<div class="sect">ARCHIVE ('+past.length+')</div>';h+=past.slice(0,30).map(cardHTML).join('');}
  body.innerHTML=h;
}
function renderCal(){
  const base=new Date(calMonth),y=base.getFullYear(),m=base.getMonth();
  const first=new Date(y,m,1),startWd=(first.getDay()+6)%7;
  const daysInMonth=new Date(y,m+1,0).getDate();
  const a=new Date(y,m,1).getTime(),b=new Date(y,m+1,1).getTime();
  const marks={};
  state.events.forEach(ev=>{if(ev.done)return;occsInRange(ev,a,b).forEach(ts=>{
    const d=new Date(ts).getDate();(marks[d]=marks[d]||[]).push(CATS[ev.category||'none'].color);});});
  const todayD=new Date(),isThisMonth=todayD.getFullYear()===y&&todayD.getMonth()===m;
  let h=`<div class="calhead glass">
    <button class="mini" onclick="calShift(-1)"><</button>
    <div class="m">${base.toLocaleDateString('en-US',{month:'short',year:'numeric'}).toUpperCase()}</div>
    <button class="mini" onclick="calShift(1)">></button>
  </div><div class="calgrid">`;
  ['MO','TU','WE','TH','FR','SA','SU'].forEach(w=>h+=`<div class="wd">${w}</div>`);
  for(let i=0;i<startWd;i++)h+='<div></div>';
  for(let d=1;d<=daysInMonth;d++){
    const cls=['day'];
    if(isThisMonth&&todayD.getDate()===d)cls.push('today');
    if(selDay===d)cls.push('sel');
    const ds=marks[d]||[];
    h+=`<div class="${cls.join(' ')}" onclick="pickDay(${d})">${d}<div class="dots">${
      ds.slice(0,3).map(c=>`<i style="background:${c}"></i>`).join('')}</div></div>`;
  }
  h+='</div>';
  if(selDay){
    const dayA=new Date(y,m,selDay).getTime(),dayB=dayA+86400000;
    const list=[];
    state.events.forEach(ev=>{if(ev.done)return;occsInRange(ev,dayA,dayB).forEach(ts=>list.push({ev,ts}));});
    list.sort((x,y2)=>x.ts-y2.ts);
    h+=`<div class="sect">TARGET: ${selDay} ${base.toLocaleDateString('en-US',{month:'short'}).toUpperCase()}</div>`;
    h+=list.length?list.map(cardHTML).join(''):'<div class="empty">NO DATA</div>';
  } else {
    const now=Date.now();
    const list=state.events.filter(e=>!e.done).map(e=>({ev:e,ts:nextOcc(e,now)})).filter(o=>o.ts>=now).sort((x,y2)=>x.ts-y2.ts).slice(0,5);
    h+='<div class="sect">NEXT_SEQ</div>';
    h+=list.length?list.map(cardHTML).join(''):'<div class="empty">EMPTY</div>';
  }
  return h;
}

async function initSW(){
  if(!('serviceWorker' in navigator))return;
  const swCode=`
    const CACHE='system-v5';
    self.addEventListener('install',()=>self.skipWaiting());
    self.addEventListener('activate',e=>e.waitUntil(clients.claim()));
    self.addEventListener('fetch',e=>{
      if(e.request.method!=='GET')return;
      e.respondWith(
        fetch(e.request).then(res=>{
          const clone=res.clone();
          caches.open(CACHE).then(c=>c.put(e.request,clone)).catch(()=>{});
          return res;
        }).catch(()=>caches.match(e.request).then(r=>r||fetch(e.request)))
      );
    });
    self.addEventListener('notificationclick',e=>{
      e.notification.close();
      e.waitUntil(clients.matchAll({type:'window'}).then(list=>{
        for(const c of list)if(c.url.includes(self.registration.scope))return c.focus();
        return clients.openWindow('./');
      }));
    });
  `;
  try{
    const blob=new Blob([swCode],{type:'application/javascript'});
    const url=URL.createObjectURL(blob);
    await navigator.serviceWorker.register(url);
  }catch(e){console.warn('SW:',e);}
}

  $('main').addEventListener('click',e=>{
    const done=e.target.closest('[data-done]');if(done)return;
    const card=e.target.closest('[data-open]');
    if(card){const ev=state.events.find(x=>x.id===card.dataset.open);if(ev)openEditor(ev);}
  });
  missedCache=getMissed(Date.now());
  render();
  setTimeout(()=>{if(state.settings.ntfy&&state.settings.ntfyConfirmed&&navigator.onLine)syncNtfyAll(true);},2500);
  window.addEventListener('online',()=>{if(state.settings.ntfy)syncNtfyAll(true);});
  setInterval(tick,500);
  setInterval(()=>{if(tab==='today'||tab==='cal')render(true);},60000);
}
init();
</script>
</body>
</html>
