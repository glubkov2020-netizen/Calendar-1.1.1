<title>Дневник ⚠️</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{margin:0;height:100%;overflow:hidden}
:root{--txt:#f2f4ff;--dim:rgba(242,244,255,.55);--dim2:rgba(242,244,255,.35);
--accent:#6ea8ff;--danger:#ff3b30;--ok:#34d399;color-scheme:dark}
html[data-theme="light"]{color-scheme:light;--txt:#0d1220;--dim:rgba(13,18,32,.6);--dim2:rgba(13,18,32,.4)}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,sans-serif;
color:var(--txt);background:#05060f;display:flex;flex-direction:column;height:100dvh;
user-select:none;-webkit-user-select:none;-webkit-font-smoothing:antialiased}
#bg{position:fixed;inset:0;z-index:-3;background:radial-gradient(120% 80% at 50% 0%,#161d42 0%,#080a1a 45%,#03040a 100%)}
html[data-theme="light"] #bg{background:radial-gradient(120% 80% at 50% 0%,#dfe7ff 0%,#eef2ff 45%,#f7f9ff 100%)}
.blob{position:fixed;border-radius:50%;filter:blur(64px);opacity:.55;z-index:-2;animation:float 20s ease-in-out infinite;will-change:transform}
.blob.b1{width:340px;height:340px;background:#4d6bff;top:-90px;left:-100px}
.blob.b2{width:300px;height:300px;background:#b14dff;top:18%;right:-120px;animation-delay:-7s}
.blob.b3{width:360px;height:360px;background:#00d4c8;bottom:-140px;left:-70px;animation-delay:-13s}
.blob.b4{width:240px;height:240px;background:#ff4d94;bottom:20%;right:-90px;animation-delay:-4s;opacity:.35}
@keyframes float{0%,100%{transform:translate3d(0,0,0) scale(1)}33%{transform:translate3d(34px,-42px,0) scale(1.14)}66%{transform:translate3d(-28px,26px,0) scale(.94)}}
.glass{position:relative;background:linear-gradient(145deg,rgba(255,255,255,.16),rgba(255,255,255,.05));
-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);
border:1px solid rgba(255,255,255,.16);box-shadow:0 8px 32px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.28),inset 0 -1px 0 rgba(255,255,255,.06);border-radius:22px}
html[data-theme="light"] .glass{background:linear-gradient(145deg,rgba(255,255,255,.85),rgba(255,255,255,.55));
border-color:rgba(255,255,255,.9);box-shadow:0 8px 30px rgba(30,50,110,.16),inset 0 1px 0 #fff}
.glass::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
background:linear-gradient(120deg,rgba(255,255,255,.30) 0%,rgba(255,255,255,0) 42%);opacity:.5;mix-blend-mode:overlay}
.tap{transition:transform .18s cubic-bezier(.32,1.5,.5,1),filter .2s}
.tap:active{transform:scale(.955);filter:brightness(1.12)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;
padding:calc(10px + env(safe-area-inset-top)) 18px 10px;z-index:20}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:44px;height:44px;border-radius:16px;display:grid;place-items:center;font-size:22px;animation:logoPulse 3s ease-in-out infinite}
@keyframes logoPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.h1{font-size:22px;font-weight:800;letter-spacing:-.4px;line-height:1.15}
.sub{font-size:12px;color:var(--dim);margin-top:2px}
.iconbtn{width:44px;height:44px;border-radius:16px;border:0;display:grid;place-items:center;font-size:19px;
color:var(--txt);cursor:pointer;flex:none}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 16px 170px;position:relative;z-index:1;overscroll-behavior-y:contain}
.view{animation:viewIn .45s cubic-bezier(.22,1.1,.36,1) both}
@keyframes viewIn{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
.hero{padding:20px;border-radius:26px;margin-bottom:12px;overflow:hidden}
.hero .lbl{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--dim);font-weight:700}
.hero .big{font-size:38px;font-weight:800;letter-spacing:-1.5px;margin:6px 0 2px;font-variant-numeric:tabular-nums;line-height:1.05}
.hero .big.neg{color:var(--danger)}
.hero .ttl{font-size:16px;font-weight:600;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero .meta{font-size:13px;color:var(--dim);margin-top:3px}
.pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:7px;
box-shadow:0 0 0 0 rgba(52,211,153,.7);animation:pulseRing 2s infinite}
@keyframes pulseRing{0%{box-shadow:0 0 0 0 rgba(52,211,153,.6)}70%{box-shadow:0 0 0 12px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
.sect{font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim2);font-weight:800;margin:20px 4px 10px}
.card{padding:14px;border-radius:20px;display:flex;gap:12px;align-items:center;margin-bottom:10px;
animation:cardIn .5s cubic-bezier(.22,1.2,.4,1) both;cursor:pointer;position:relative;overflow:hidden}
@keyframes cardIn{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
.card.done{opacity:.45}
.card.done .ctitle{text-decoration:line-through}
.card.critical{border-color:rgba(255,77,106,.7);box-shadow:0 0 0 1px rgba(255,77,106,.5),0 8px 28px rgba(255,60,90,.25)}
html[data-theme="light"] .card.critical{border-color:rgba(255,77,106,.9)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.grow{flex:1;min-width:0}
.ctitle{font-size:15.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.csub{font-size:12.5px;color:var(--dim);margin-top:3px;display:flex;gap:6px;align-items:center;flex-wrap:nowrap;overflow:hidden}
.cat-pill{font-size:10px;padding:2px 7px;border-radius:8px;font-weight:700;letter-spacing:.3px;flex:none}
.cd{font-size:13px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;flex:none;text-align:right}
.cd.neg{color:var(--danger)}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,.3);flex:none;
display:grid;place-items:center;font-size:13px;color:transparent;transition:.2s;background:rgba(255,255,255,.05);cursor:pointer}
.chk:active{transform:scale(.85)}
.chk.on{background:var(--ok);border-color:var(--ok);color:#04231a;box-shadow:0 0 12px rgba(52,211,153,.6)}
.empty{padding:40px 16px;text-align:center;color:var(--dim2);font-size:14px}
input,select,textarea,button{font-family:inherit;font-size:16px}
.field{width:100%;padding:13px 14px;border-radius:16px;border:1px solid rgba(255,255,255,.14);
background:rgba(255,255,255,.07);color:var(--txt);outline:none;transition:.2s;-webkit-appearance:none;appearance:none}
html[data-theme="light"] .field{background:rgba(255,255,255,.7);border-color:rgba(20,40,90,.12);color:#0d1220}
.field:focus{border-color:rgba(120,170,255,.75);box-shadow:0 0 0 4px rgba(90,140,255,.18)}
.field::placeholder{color:var(--dim2)}
.row{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{padding:8px 12px;border-radius:14px;font-size:13px;border:1px solid rgba(255,255,255,.15);
background:rgba(255,255,255,.06);color:var(--dim);transition:.2s;cursor:pointer}
html[data-theme="light"] .chip{background:rgba(255,255,255,.6);border-color:rgba(20,40,90,.1);color:#3b4664}
.chip.on{background:linear-gradient(145deg,rgba(110,170,255,.5),rgba(110,170,255,.2));color:#fff;
border-color:rgba(150,200,255,.7);box-shadow:0 0 18px rgba(90,150,255,.4);transform:scale(1.04)}
.btn{padding:13px 16px;border-radius:16px;border:1px solid rgba(255,255,255,.16);cursor:pointer;
background:rgba(255,255,255,.08);color:var(--txt);font-weight:650;transition:.18s;
display:flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:scale(.96);filter:brightness(1.15)}
.btn.primary{background:linear-gradient(145deg,#5b8dff,#3f6bff);border-color:rgba(150,190,255,.5);
box-shadow:0 8px 24px rgba(70,110,255,.45),inset 0 1px 0 rgba(255,255,255,.4);color:#fff}
.btn.danger{background:linear-gradient(145deg,rgba(255,70,60,.9),rgba(200,30,25,.9));
border-color:rgba(255,150,140,.5);color:#fff}
.btn.small{padding:9px 12px;font-size:13px;border-radius:12px}
.label{font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim2);font-weight:800;margin:14px 2px 8px}
.hint{font-size:12.5px;color:var(--dim);line-height:1.5}
.mini{width:30px;height:30px;border-radius:11px;border:1px solid rgba(255,255,255,.15);
background:rgba(255,255,255,.08);color:var(--txt);display:grid;place-items:center;font-size:14px;cursor:pointer}
.remrow{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;
border-radius:14px;margin-bottom:6px;font-size:13.5px}
.tabbar{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));
display:flex;gap:3px;padding:6px;border-radius:26px;z-index:60}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0;border-radius:20px;
font-size:10px;font-weight:700;color:var(--dim);background:transparent;border:0;transition:.25s;cursor:pointer}
.tab .ic{font-size:19px;line-height:1;transition:transform .3s cubic-bezier(.32,1.6,.5,1)}
.tab.active{color:var(--txt);background:linear-gradient(145deg,rgba(255,255,255,.24),rgba(255,255,255,.08));
box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 4px 16px rgba(0,0,0,.3)}
.tab.active .ic{transform:translateY(-2px) scale(1.15)}
.fab{position:fixed;right:18px;bottom:calc(96px + env(safe-area-inset-bottom));width:62px;height:62px;
border-radius:22px;border:1px solid rgba(180,210,255,.5);font-size:30px;font-weight:300;color:#fff;
background:linear-gradient(145deg,#6e9dff,#3c62ff);z-index:61;cursor:pointer;
box-shadow:0 12px 32px rgba(60,100,255,.55),inset 0 1px 0 rgba(255,255,255,.5);
display:grid;place-items:center;transition:transform .2s cubic-bezier(.32,1.6,.5,1)}
.fab:active{transform:scale(.9) rotate(90deg)}
.sheetwrap{position:fixed;inset:0;z-index:90;display:flex;align-items:flex-end;
background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
opacity:0;pointer-events:none;transition:opacity .3s}
.sheetwrap.open{opacity:1;pointer-events:auto}
.sheet{width:100%;max-height:92dvh;overflow-y:auto;border-radius:30px 30px 0 0;
padding:16px 18px calc(28px + env(safe-area-inset-bottom));
transform:translateY(100%);transition:transform .48s cubic-bezier(.32,1.14,.4,1);
background:linear-gradient(160deg,rgba(28,34,64,.96),rgba(14,18,36,.98));
-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
border-top:1px solid rgba(255,255,255,.2);box-shadow:0 -20px 60px rgba(0,0,0,.7)}
html[data-theme="light"] .sheet{background:linear-gradient(160deg,rgba(255,255,255,.98),rgba(238,242,255,.98))}
.sheetwrap.open .sheet{transform:translateY(0)}
.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sheettitle{font-size:20px;font-weight:800;letter-spacing:-.3px}
.grab{width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.25);margin:0 auto 12px}
#alarm{position:fixed;inset:0;z-index:300;display:none;flex-direction:column;align-items:center;
justify-content:center;gap:16px;padding:28px;text-align:center;
background:radial-gradient(circle at 50% 40%,rgba(255,59,48,.62),rgba(110,0,0,.95));
-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
#alarm.on{display:flex;animation:alarmPulse 1.05s infinite}
@keyframes alarmPulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.55)}}
#alarm .warn{font-size:88px;line-height:1;animation:warnBounce .7s infinite alternate cubic-bezier(.32,1.6,.5,1);
filter:drop-shadow(0 0 30px rgba(255,220,120,.9))}
@keyframes warnBounce{from{transform:scale(1) rotate(-7deg)}to{transform:scale(1.22) rotate(7deg)}}
#alarm .atitle{font-size:26px;font-weight:900;color:#fff;text-shadow:0 4px 20px rgba(0,0,0,.6);max-width:100%}
#alarm .awhen{font-size:15px;color:rgba(255,255,255,.9);font-weight:600}
#alarm .abtns{display:flex;flex-direction:column;gap:10px;width:100%;max-width:340px;margin-top:14px}
#alarm .abtn{padding:17px;border-radius:20px;border:1px solid rgba(255,255,255,.4);font-size:17px;
font-weight:800;background:rgba(255,255,255,.16);color:#fff;-webkit-backdrop-filter:blur(20px);
backdrop-filter:blur(20px);cursor:pointer;transition:.18s}
#alarm .abtn:active{transform:scale(.96);background:rgba(255,255,255,.3)}
#alarm .abtn.main{background:#fff;color:#c1121f;border-color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#toast{position:fixed;left:50%;bottom:calc(180px + env(safe-area-inset-bottom));transform:translate(-50%,20px);
padding:12px 20px;border-radius:18px;font-size:14px;font-weight:650;z-index:400;opacity:0;
pointer-events:none;transition:.35s cubic-bezier(.32,1.4,.4,1);max-width:90vw;text-align:center;
background:rgba(20,26,50,.94);border:1px solid rgba(255,255,255,.2);color:#fff;
-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:0 10px 30px rgba(0,0,0,.5)}
#toast.on{opacity:1;transform:translate(-50%,0)}
.calhead{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-radius:20px;margin-bottom:12px}
.calhead .m{font-size:17px;font-weight:800;text-transform:capitalize}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.wd{text-align:center;font-size:11px;font-weight:800;color:var(--dim2);padding:4px 0}
.day{aspect-ratio:1;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;
gap:3px;font-size:14px;font-weight:650;color:var(--txt);background:rgba(255,255,255,.045);
border:1px solid transparent;transition:.2s;cursor:pointer;position:relative}
html[data-theme="light"] .day{background:rgba(255,255,255,.55)}
.day.today{border-color:rgba(110,168,255,.9);box-shadow:0 0 14px rgba(110,168,255,.4)}
.day.sel{background:linear-gradient(145deg,#6e9dff,#3c62ff);color:#fff;box-shadow:0 6px 20px rgba(60,100,255,.5)}
.dots{display:flex;gap:2px;height:5px}
.dots i{width:4px;height:4px;border-radius:50%;display:block}
.settingscard{padding:16px;border-radius:22px;margin-bottom:12px}
.banner{padding:14px 16px;border-radius:20px;margin-bottom:12px;display:flex;gap:12px;align-items:center;animation:cardIn .5s both}
.banner.warn{border-color:rgba(255,120,90,.6);background:linear-gradient(145deg,rgba(255,90,70,.25),rgba(255,90,70,.1))}
.banner.info{border-color:rgba(110,168,255,.5);background:linear-gradient(145deg,rgba(110,168,255,.2),rgba(110,168,255,.08))}
.banner .em{font-size:28px;flex:none}
.banner .bt{flex:1;min-width:0}
.banner .bt b{display:block;font-size:14px;margin-bottom:2px}
.banner .bt small{font-size:12px;color:var(--dim)}
.quickrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.filterbar{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 12px;margin:0 -4px;scrollbar-width:none}
.filterbar::-webkit-scrollbar{display:none}
.fchip{padding:7px 12px;border-radius:12px;font-size:12px;font-weight:650;white-space:nowrap;
border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);color:var(--dim);cursor:pointer;transition:.2s}
.fchip.on{background:linear-gradient(145deg,rgba(255,255,255,.28),rgba(255,255,255,.12));color:var(--txt);
border-color:rgba(255,255,255,.5)}
</style>
</head>
<body>

<div id="bg"></div>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div>

<header class="topbar">
  <div class="brand">
    <div class="logo glass">⚠️</div>
    <div style="min-width:0">
      <div class="h1" id="topTitle">Сегодня</div>
      <div class="sub" id="topDate">—</div>
    </div>
  </div>
  <button class="iconbtn glass tap" id="btnBell" onclick="askNotify()">🔔</button>
</header>

<main id="main"></main>
<button class="fab" onclick="openEditor(null)">＋</button>

<nav class="tabbar glass">
  <button class="tab active" data-tab="today"><span class="ic">🌙</span><span>Сегодня</span></button>
  <button class="tab" data-tab="list"><span class="ic">📋</span><span>Список</span></button>
  <button class="tab" data-tab="cal"><span class="ic">📅</span><span>Календарь</span></button>
  <button class="tab" data-tab="set"><span class="ic">⚙️</span><span>Настройки</span></button>
</nav>

<div class="sheetwrap" id="sheetwrap" onclick="if(event.target===this)closeSheet()">
  <div class="sheet" id="sheet"></div>
</div>

<div id="alarm">
  <div class="warn">⚠️</div>
  <div class="atitle" id="alarmTitle">—</div>
  <div class="awhen" id="alarmWhen">—</div>
  <div class="abtns">
    <button class="abtn main" onclick="dismissAlarm(0)">Я увидел, понял ✓</button>
    <button class="abtn" onclick="dismissAlarm(5)">Напомнить через 5 минут</button>
    <button class="abtn" onclick="dismissAlarm(60)">Напомнить через 1 час</button>
  </div>
</div>

<div id="toast"></div>

<script>
/* ============ КОНСТАНТЫ ============ */
const KEY='glass_diary_v3';
const PRESETS=[
  {l:'5 мин',s:300},{l:'15 мин',s:900},{l:'30 мин',s:1800},
  {l:'1 ч',s:3600},{l:'2 ч',s:7200},{l:'6 ч',s:21600},{l:'12 ч',s:43200},
  {l:'24 ч',s:86400},{l:'2 дня',s:172800},{l:'4 дня',s:345600},
  {l:'1 нед',s:604800},{l:'2 нед',s:1209600},{l:'1 мес',s:2592000}
];
const CATS={
  none:{label:'Обычное',color:'#8890a8',icon:'•'},
  work:{label:'Работа',color:'#6ea8ff',icon:'💼'},
  health:{label:'Здоровье',color:'#34d399',icon:'💊'},
  money:{label:'Деньги',color:'#ffb26e',icon:'💰'},
  personal:{label:'Личное',color:'#b18cff',icon:'🏠'},
  urgent:{label:'Важное',color:'#ff4d6a',icon:'🔥'}
};
const COLORS=['#6ea8ff','#b18cff','#ff6ea8','#ffb26e','#6ee7c8','#8cff7a','#ff6e6e','#5ee0ff'];
const DEF={ntfy:'',sound:true,theme:'auto'};
const FIRE_WINDOW=30*60*1000;
const MISSED_WINDOW=7*24*3600*1000;

/* ============ СОСТОЯНИЕ ============ */
let state=loadState(),tab='today',editing=null,
    calMonth=(()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),1).getTime()})(),
    selDay=null,search='',filterCat='all',alarmQueue=[],currentAlarm=null,
    lastDayKey=new Date().toDateString(),missedCache=[];

function loadState(){
  try{
    const raw=JSON.parse(localStorage.getItem(KEY));

      });
      return {events:raw.events,snoozes:raw.snoozes||[],settings:Object.assign({},DEF,raw.settings||{})};
    }
  }catch(e){}
  return {events:[],snoozes:[],settings:Object.assign({},DEF)};
}

/* ============ УТИЛИТЫ ============ */
const $=id=>document.getElementById(id);
const p2=n=>String(n).padStart(2,'0');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtTime=ts=>{const d=new Date(ts);return p2(d.getHours())+':'+p2(d.getMinutes());};
const fmtDateTime=ts=>{const d=new Date(ts);return p2(d.getDate())+'.'+p2(d.getMonth()+1)+'.'+d.getFullYear()+' '+p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds());};
function fmtDay(ts){
  const d=new Date(ts),n=new Date();
  const s=x=>new Date(x.getFullYear(),x.getMonth(),x.getDate()).getTime();
  const diff=Math.round((s(d)-s(n))/86400000);
  if(diff===0)return 'сегодня';if(diff===1)return 'завтра';if(diff===-1)return 'вчера';
  const wd=['вс','пн','вт','ср','чт','пт','сб'][d.getDay()];
  return wd+', '+p2(d.getDate())+'.'+p2(d.getMonth()+1);
}
function fmtDur(ms){
  const neg=ms<0;ms=Math.abs(ms);
  const t=Math.floor(ms/1000),d=Math.floor(t/86400),h=Math.floor(t%86400/3600),m=Math.floor(t%3600/60),s=t%60;
  let out;
  if(d>0)out=d+' д '+h+' ч '+m+' м';
  else if(h>0)out=h+' ч '+m+' м';
  else if(m>0)out=m+' м '+p2(s)+' с';
  else out=s+' с';
  return (neg?'-':'')+out;
}
function secLabel(s){
  if(s>=2592000&&s%2592000===0)return (s/2592000)+' мес';
  if(s>=604800&&s%604800===0)return (s/604800)+' нед';
  if(s>=86400&&s%86400===0)return (s/86400)+' дн';
  if(s>=3600&&s%3600===0)return (s/3600)+' ч';
  if(s>=60&&s%60===0)return (s/60)+' мин';
  return s+' сек';
}
const toLocalInput=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())+'T'+p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds());};
const fromLocalInput=v=>{if(!v)return null;const t=new Date(v).getTime();return isNaN(t)?null:t;};
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('on');clearTimeout(t._tm);t._tm=setTimeout(()=>t.classList.remove('on'),2400);}
function vibrate(pat){try{if(navigator.vibrate)navigator.vibrate(pat);}catch(e){}}
function download(name,content,type){
  const b=new Blob([content],{type:type+';charset=utf-8'}),a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
}

/* ============ ПОВТОРЫ ============ */
function stepDate(d,rep){
  if(rep==='daily')d.setDate(d.getDate()+1);
  else if(rep==='weekly')d.setDate(d.getDate()+7);
  else if(rep==='monthly')d.setMonth(d.getMonth()+1);
  else if(rep==='yearly')d.setFullYear(d.getFullYear()+1);
}
function nextOcc(ev,from){
  if(!ev.repeat||ev.repeat==='none')return ev.ts;
  if(ev.ts>=from)return ev.ts;
  const cur=new Date(ev.ts);let g=0;
  while(cur.getTime()<from&&g++<5000)stepDate(cur,ev.repeat);
  return cur.getTime();
}
function latestOcc(ev,limit){
  if(!ev.repeat||ev.repeat==='none')return ev.ts<=limit?ev.ts:null;
  if(ev.ts>limit)return null;
  const cur=new Date(ev.ts);let g=0;
  while(g++<5000){const nx=new Date(cur.getTime());stepDate(nx,ev.repeat);if(nx.getTime()>limit)break;cur.setTime(nx.getTime());}
  return cur.getTime();
}
function occsInRange(ev,a,b){
  const out=[];
  if(!ev.repeat||ev.repeat==='none'){if(ev.ts>=a&&ev.ts<b)out.push(ev.ts);return out;}
  const cur=new Date(ev.ts);let g=0;
  while(cur.getTime()<a&&g++<5000)stepDate(cur,ev.repeat);
  let g2=0;
  while(cur.getTime()<b&&g2++<400){if(cur.getTime()>=a)out.push(cur.getTime());stepDate(cur,ev.repeat);}
  return out;
}
function occsForward(ev,from,to){
  const out=[];
  if(!ev.repeat||ev.repeat==='none'){if(ev.ts>=from&&ev.ts<=to)out.push(ev.ts);return out;}
  const cur=new Date(ev.ts);let g=0;
  while(cur.getTime()<from&&g++<5000)stepDate(cur,ev.repeat);
  let g2=0;
  while(cur.getTime()<=to&&g2++<200){out.push(cur.getTime());stepDate(cur,ev.repeat);}
  return out;
}

/* ============ НАПОМИНАНИЯ ============ */
function remTarget(ev,r,now){
  if(r.kind==='abs')return r.ts;
  const occ=latestOcc(ev,now+r.sec*1000);
  return occ==null?null:occ-r.sec*1000;
}
function remKey(ev,r,now){
  if(r.kind==='abs')return r.id+'@abs';
  const occ=latestOcc(ev,now+r.sec*1000);
  return r.id+'@'+occ;
}
function remLabel(r){return r.kind==='abs'?'⏰ '+fmtDateTime(r.ts):'⏳ за '+secLabel(r.sec);}
function getMissed(now){
  const out=[];
  for(const ev of state.events){
    if(ev.done)continue;
    for(const r of ev.reminders){
      const target=remTarget(ev,r,now);
      if(target==null)continue;
      if(target<now-60000&&target>now-MISSED_WINDOW){
        const key=remKey(ev,r,now);
        if(!ev.fired.includes(key))out.push({ev,r,target,key});
      }
    }
  }
  return out;
}
function checkReminders(now){
  let changed=false;
  for(const ev of state.events){
    if(ev.done)continue;
    for(const r of ev.reminders){
      const target=remTarget(ev,r,now);
      if(target==null||target>now)continue;
      const key=remKey(ev,r,now);
      if(ev.fired.includes(key))continue;
      const age=now-target;
      if(age>FIRE_WINDOW){ev.fired.push(key);changed=true;continue;}
      ev.fired.push(key);changed=true;
      if(ev.fired.length>300)ev.fired=ev.fired.slice(-300);
      queueAlarm({title:ev.title||'Событие',sub:remLabel(r),when:target,critical:ev.priority==='critical'});
    }
  }
  if(changed)saveState();
}
function checkSnoozes(now){
  let changed=false;
  state.snoozes=state.snoozes.filter(s=>{
    if(s.ts<=now){queueAlarm({title:s.title,sub:s.sub||'отложено',when:s.ts,critical:false});changed=true;return false;}
    return true;
  });
  if(changed)saveState();
}

/* ============ ЗВУК ============ */
let audioCtx=null,siren=null;
function unlockAudio(){
  try{
    if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    audioCtx.resume();
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.frequency.value=880;g.gain.value=0.0001;o.connect(g);g.connect(audioCtx.destination);
    g.gain.exponentialRampToValueAtTime(0.12,audioCtx.currentTime+0.03);
    g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+0.25);
    o.start();o.stop(audioCtx.currentTime+0.3);
    state.settings.sound=true;saveState();toast('Звук включён 🔊');
  }catch(e){toast('Не удалось включить звук');}
}
function startSiren(){
  if(!state.settings.sound)return;
  try{
    if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended')audioCtx.resume();
    stopSiren();
    const o=audioCtx.createOscillator(),g=audioCtx.createGain(),lfo=audioCtx.createOscillator(),lg=audioCtx.createGain();
    o.type='sawtooth';o.frequency.value=820;lfo.type='sine';lfo.frequency.value=2.6;lg.gain.value=280;
    lfo.connect(lg);lg.connect(o.frequency);g.gain.value=0.0001;
    g.gain.exponentialRampToValueAtTime(0.16,audioCtx.currentTime+0.08);
    o.connect(g);g.connect(audioCtx.destination);o.start();lfo.start();
    siren={o,g,lfo};
  }catch(e){}
}
function stopSiren(){
  if(!siren||!audioCtx)return;
  try{const{o,g,lfo}=siren;g.gain.cancelScheduledValues(audioCtx.currentTime);
    g.gain.setTargetAtTime(0.0001,audioCtx.currentTime,0.05);
    setTimeout(()=>{try{o.stop();lfo.stop();}catch(e){}},250);}catch(e){}
  siren=null;
}

/* ============ NTFY ============ */
async function postNtfySchedule(ev,r,target){
  if(!state.settings.ntfy)return false;
  const secs=Math.round((target-Date.now())/1000);
  if(secs<15)return false;
  try{
    const res=await fetch('https://ntfy.sh',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        topic:state.settings.ntfy,
        title:'⚠️ '+(ev.title||'Событие'),
        message:remLabel(r)+'\n'+fmtDateTime(target),
        priority:5,tags:['warning'],
        delay:secs+'s'
      })
    });
    return res.ok;
  }catch(e){return false;}
}
async function scheduleNtfyForEvent(ev){
  if(!state.settings.ntfy||!navigator.onLine)return 0;
  const now=Date.now(),until=now+7*86400000;
  const occs=occsForward(ev,now,until);
  let count=0;
  for(const r of ev.reminders){
    for(const occ of occs){
      const target=r.kind==='abs'?r.ts:occ-r.sec*1000;
      if(target<now+15000)continue;
      const key=r.id+'@'+occ;
      if(ev._scheduled&&ev._scheduled[key])continue;
      const ok=await postNtfySchedule(ev,r,target);
      if(ok){ev._scheduled=ev._scheduled||{};ev._scheduled[key]=1;count++;}
    }
  }
  if(count)saveState();
  return count;
}
async function syncNtfyAll(){
  if(!state.settings.ntfy){toast('Сначала укажи топик ntfy');return;}
  if(!navigator.onLine){toast('Нет интернета');return;}
  let total=0;
  for(const ev of state.events){
    if(ev.done)continue;
    total+=await scheduleNtfyForEvent(ev);
  }
  toast(total?`Отправлено ${total} напоминаний ✓`:'Нечего отправлять');
}
async function testNtfy(){
  if(!state.settings.ntfy){toast('Сначала укажи топик');return;}

/* ============ ЭКСПОРТ ICS ============ */
function icsEsc(s){return String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');}
function icsUTC(ts){return new Date(ts).toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';}
function getTZID(){
  const off=-new Date().getTimezoneOffset();
  const sign=off>=0?'+':'-',abs=Math.abs(off);
  return 'Etc/GMT'+sign+Math.floor(abs/60);
}
function exportICS(){
  const now=Date.now(),tz=getTZID();
  let out=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//GlassDiary//RU','CALSCALE:GREGORIAN','METHOD:PUBLISH'];
  state.events.forEach(ev=>{
    if(ev.done)return;
    const dur=ev.duration||3600000;
    const dtStart=new Date(ev.ts).toLocaleString('sv-SE').replace(/[-:]/g,'').replace(' ','T');
    const dtEnd=new Date(ev.ts+dur).toLocaleString('sv-SE').replace(/[-:]/g,'').replace(' ','T');
    out.push('BEGIN:VEVENT');
    out.push('UID:'+ev.id+'@glassdiary');
    out.push('DTSTAMP:'+icsUTC(now));
    out.push('DTSTART;TZID='+tz+':'+dtStart);
    out.push('DTEND;TZID='+tz+':'+dtEnd);
    out.push('SUMMARY:'+icsEsc(ev.title||'Событие'));
    if(ev.notes)out.push('DESCRIPTION:'+icsEsc(ev.notes));
    if(ev.repeat==='daily')out.push('RRULE:FREQ=DAILY');
    if(ev.repeat==='weekly')out.push('RRULE:FREQ=WEEKLY');
    if(ev.repeat==='monthly')out.push('RRULE:FREQ=MONTHLY');
    if(ev.repeat==='yearly')out.push('RRULE:FREQ=YEARLY');
    (ev.reminders||[]).forEach(r=>{
      out.push('BEGIN:VALARM');
      if(r.kind==='abs'){
        const delta=Math.round((r.ts-ev.ts)/1000);
        out.push('TRIGGER:'+(delta>=0?'PT'+delta+'S':'-PT'+(-delta)+'S'));
      }else{
        out.push('TRIGGER:-PT'+r.sec+'S');
      }
      out.push('ACTION:DISPLAY');
      out.push('DESCRIPTION:'+icsEsc(ev.title||'Событие'));
      out.push('END:VALARM');
    });
    out.push('END:VEVENT');
  });
  out.push('END:VCALENDAR');
  download('dnevnik.ics',out.join('\r\n'),'text/calendar');
  toast('Файл .ics скачан — открой его и добавь в Календарь');
}
function exportJSON(){
  download('dnevnik-backup.json',JSON.stringify(state,null,2),'application/json');
  toast('Бэкап скачан');
}
function importJSON(inp){
  const f=inp.files&&inp.files[0];if(!f)return;
  const rd=new FileReader();

      else toast('Неверный файл');

  rd.readAsText(f);inp.value='';
}

  };
  const items=state.events.filter(matches).map(e=>({ev:e,ts:nextOcc(e,now)}));
  const future=items.filter(o=>o.ts>=now).sort((a,b)=>a.ts-b.ts);
  const past=items.filter(o=>o.ts<now).sort((a,b)=>b.ts-a.ts);
  let h='<div class="sect">Предстоящие ('+future.length+')</div>';
  h+=future.length?future.map(cardHTML).join(''):'<div class="empty">Пусто</div>';
  if(past.length){h+='<div class="sect">Прошедшие ('+past.length+')</div>';h+=past.slice(0,30).map(cardHTML).join('');}
  body.innerHTML=h;
}
function renderCal(){
  const base=new Date(calMonth),y=base.getFullYear(),m=base.getMonth();
  const first=new Date(y,m,1),startWd=(first.getDay()+6)%7;
  const daysInMonth=new Date(y,m+1,0).getDate();
  const a=new Date(y,m,1).getTime(),b=new Date(y,m+1,1).getTime();
  const marks={};
  state.events.forEach(ev=>{if(ev.done)return;occsInRange(ev,a,b).forEach(ts=>{
    const d=new Date(ts).getDate();(marks[d]=marks[d]||[]).push(CATS[ev.category||'none'].color);});});
  const todayD=new Date(),isThisMonth=todayD.getFullYear()===y&&todayD.getMonth()===m;
  let h=`<div class="calhead glass">
    <button class="mini" onclick="calShift(-1)">‹</button>
    <div class="m">${base.toLocaleDateString('ru-RU',{month:'long',year:'numeric'})}</div>
    <button class="mini" onclick="calShift(1)">›</button>
  </div><div class="calgrid">`;
  ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].forEach(w=>h+=`<div class="wd">${w}</div>`);
  for(let i=0;i<startWd;i++)h+='<div></div>';
  for(let d=1;d<=daysInMonth;d++){
    const cls=['day'];
    if(isThisMonth&&todayD.getDate()===d)cls.push('today');
    if(selDay===d)cls.push('sel');
    const ds=marks[d]||[];
    h+=`<div class="${cls.join(' ')}" onclick="pickDay(${d})">${d}<div class="dots">${
      ds.slice(0,3).map(c=>`<i style="background:${c}"></i>`).join('')}</div></div>`;
  }
  h+='</div>';
  if(selDay){
    const dayA=new Date(y,m,selDay).getTime(),dayB=dayA+86400000;
    const list=[];
    state.events.forEach(ev=>{if(ev.done)return;occsInRange(ev,dayA,dayB).forEach(ts=>list.push({ev,ts}));});
    list.sort((x,y2)=>x.ts-y2.ts);
    h+=`<div class="sect">${selDay} ${base.toLocaleDateString('ru-RU',{month:'long'})}</div>`;
    h+=list.length?list.map(cardHTML).join(''):'<div class="empty">В этот день ничего</div>';
  } else {
    const now=Date.now();
    const list=state.events.filter(e=>!e.done).map(e=>({ev:e,ts:nextOcc(e,now)})).filter(o=>o.ts>=now).sort((x,y2)=>x.ts-y2.ts).slice(0,5);
    h+='<div class="sect">Ближайшее</div>';
    h+=list.length?list.map(cardHTML).join(''):'<div class="empty">Пусто</div>';
  }
  return h;
}

/* ============ SERVICE WORKER (inline) ============ */
async function initSW(){
  if(!('serviceWorker' in navigator))return;
  const swCode=`
    const CACHE='diary-v3';
    self.addEventListener('install',()=>self.skipWaiting());
    self.addEventListener('activate',e=>e.waitUntil(clients.claim()));
    self.addEventListener('fetch',e=>{
      if(e.request.method!=='GET')return;
      e.respondWith(
        fetch(e.request).then(res=>{
          const clone=res.clone();
          caches.open(CACHE).then(c=>c.put(e.request,clone)).catch(()=>{});
          return res;
        }).catch(()=>caches.match(e.request).then(r=>r||fetch(e.request)))
      );
    });
    self.addEventListener('notificationclick',e=>{
      e.notification.close();
      e.waitUntil(clients.matchAll({type:'window'}).then(list=>{
        for(const c of list)if(c.url.includes(self.registration.scope))return c.focus();
        return clients.openWindow('./');
      }));
    });
  `;
  try{
    const blob=new Blob([swCode],{type:'application/javascript'});
    const url=URL.createObjectURL(blob);
    await navigator.serviceWorker.register(url);
  }catch(e){console.warn('SW:',e);}
}

/* ============ СТАРТ ============ */
async function init(){
  applyTheme();
  matchMedia('(prefers-color-scheme: light)').addEventListener('change',()=>{if(state.settings.theme==='auto')applyTheme();});
  initManifest();
  await initSW();
  document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;selDay=null;render();}));
  $('main').addEventListener('click',e=>{
    const done=e.target.closest('[data-done]');if(done)return;
    const card=e.target.closest('[data-open]');
    if(card){const ev=state.events.find(x=>x.id===card.dataset.open);if(ev)openEditor(ev);}
  });
  missedCache=getMissed(Date.now());
  render();
  setTimeout(()=>{if(state.settings.ntfy&&navigator.onLine)syncNtfyAll();},3000);
  window.addEventListener('online',()=>{if(state.settings.ntfy)syncNtfyAll();});
  setInterval(tick,500);
  setInterval(()=>{if(tab==='today'||tab==='cal')render(true);},60000);
}
init();
</script>
