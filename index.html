<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Терминал">
<meta name="theme-color" content="#020503">
<link rel="apple-touch-icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxODAgMTgwIj48cmVjdCB3aWR0aD0iMTgwIiBoZWlnaHQ9IjE4MCIgcng9IjQwIiBmaWxsPSIjMDIwNTAzIi8+PHBhdGggZD0iTTUwIDUwIEwxMzAgNTAgTDEzMCAxMzAgTDUwIDEzMCBaIiBmaWxsPSJub25lIiBzdHJva2U9IiMwMGZmNjYiIHN0cm9rZS13aWR0aD0iNiIgc3Ryb2tlLWxpbmVqb2luPSJyb3VuZCIvPjxjaXJjbGUgY3g9IjkwIiBjeT0iOTAiIHI9IjE1IiBmaWxsPSIjMDBmZjY2Ii8+PC9zdmc+">
<title>Терминал // Система</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#020503}
:root{
  --bg:#020503;
  --panel:rgba(4,10,6,0.85);
  --txt:#e0ffe0;
  --dim:rgba(224,255,224,0.6);
  --dim2:rgba(224,255,224,0.35);
  --accent:#00ff66;
  --accent-dim:rgba(0,255,102,0.2);
  --danger:#ff003c;
  --warn:#ffb000;
  --border:rgba(0,255,102,0.25);
  --border-focus:rgba(0,255,102,0.8);
  --safe-top:env(safe-area-inset-top, 0px);
  --safe-bottom:env(safe-area-inset-bottom, 0px);
  color-scheme:dark;
}
body{
  font-family:'Courier New',Courier,monospace;
  color:var(--txt);
  display:flex;flex-direction:column;height:100dvh;
  user-select:none;-webkit-user-select:none;
  background-image:
    linear-gradient(rgba(0,255,102,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,255,102,0.03) 1px, transparent 1px);
  background-size: 20px 20px;
  padding-top:var(--safe-top);
  padding-bottom:var(--safe-bottom);
}

/* Постоянные анимации фона */
#bg-grid{position:fixed;inset:0;z-index:-3;pointer-events:none}
#bg-glow{position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:radial-gradient(circle at 50% 0%, rgba(0,255,102,0.08) 0%, transparent 60%);}
.scanline{position:fixed;top:0;left:0;right:0;height:100%;z-index:-1;pointer-events:none;
  background:linear-gradient(to bottom, transparent 50%, rgba(0,0,0,0.3) 51%);background-size:100% 4px;
  animation:scanline 10s linear infinite;opacity:0.3}
@keyframes scanline{0%{background-position:0 0}100%{background-position:0 100vh}}
.corner{position:fixed;width:30px;height:30px;border:2px solid var(--accent);opacity:0.4;z-index:100;pointer-events:none;animation:pulseCorner 2s infinite alternate}
.c-tl{top:calc(8px + var(--safe-top));left:8px;border-right:none;border-bottom:none}
.c-tr{top:calc(8px + var(--safe-top));right:8px;border-left:none;border-bottom:none}
.c-bl{bottom:calc(8px + var(--safe-bottom));left:8px;border-right:none;border-top:none}
.c-br{bottom:calc(8px + var(--safe-bottom));right:8px;border-left:none;border-top:none}
@keyframes pulseCorner{from{opacity:0.2;transform:scale(0.9)}to{opacity:1;transform:scale(1.1)}}

/* Контейнер для контента строго в рамках */
.app-container{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;width:100%;max-width:800px;margin:0 auto}

/* Шапка */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;
  background:rgba(2,5,3,0.9);border-bottom:1px solid var(--border);backdrop-filter:blur(10px);z-index:20}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:36px;height:36px;border-radius:4px;display:grid;place-items:center;font-size:18px;
  border:1px solid var(--accent);color:var(--accent);box-shadow:inset 0 0 10px var(--accent-dim);animation:blink 3s infinite}
@keyframes blink{0%,100%{box-shadow:inset 0 0 5px var(--accent-dim)}50%{box-shadow:inset 0 0 20px var(--accent)}}
.h1{font-size:16px;font-weight:700;letter-spacing:1px;color:var(--accent);text-shadow:0 0 5px var(--accent)}
.sub{font-size:10px;color:var(--dim);margin-top:2px;letter-spacing:1px}
.iconbtn{width:36px;height:36px;border-radius:4px;border:1px solid var(--border);
  background:rgba(0,0,0,0.5);display:grid;place-items:center;font-size:16px;
  color:var(--accent);cursor:pointer;position:relative}
.iconbtn::after{content:'';position:absolute;inset:0;box-shadow:inset 0 0 10px var(--accent-dim);border-radius:4px;pointer-events:none}
.iconbtn.off{color:var(--danger);border-color:var(--danger)}

/* Главный скролл */
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px;scrollbar-width:none}
main::-webkit-scrollbar{display:none}
.view{animation:fadeIn 0.4s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* Панели */
.panel{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:16px;
  position:relative;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,0.8), inset 0 0 20px rgba(0,255,102,0.03)}
.panel::before{content:'///';position:absolute;top:4px;right:8px;font-size:10px;color:var(--dim);opacity:0.5;letter-spacing:2px}
.panel::after{content:'';position:absolute;top:0;left:0;width:100%;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:0.5}

/* Герой (таймер) */
.hero{background:linear-gradient(180deg, rgba(0,255,102,0.1) 0%, rgba(0,0,0,0) 100%);
  border:1px solid var(--accent);border-radius:8px;padding:20px;margin-bottom:16px;position:relative;
  box-shadow:0 0 20px rgba(0,255,102,0.1);animation:heroPulse 4s infinite}
@keyframes heroPulse{0%,100%{box-shadow:0 0 15px rgba(0,255,102,0.1)}50%{box-shadow:0 0 30px rgba(0,255,102,0.25)}}
.hero .lbl{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.hero .lbl::before{content:'';width:8px;height:8px;background:var(--accent);border-radius:50%;box-shadow:0 0 10px var(--accent);animation:blinkDot 1s infinite}
@keyframes blinkDot{0%,100%{opacity:1}50%{opacity:0.3}}
.hero .big{font-size:38px;font-weight:800;color:#fff;text-shadow:0 0 15px rgba(0,255,102,0.5);letter-spacing:1px;font-variant-numeric:tabular-nums;margin-bottom:8px}
.hero .big.neg{color:var(--danger);text-shadow:0 0 15px rgba(255,0,60,0.5)}
.hero .ttl{font-size:16px;font-weight:700;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero .meta{font-size:12px;color:var(--dim);margin-top:4px;letter-spacing:1px}

/* Заголовки */
.sect{font-size:11px;letter-spacing:2px;color:var(--dim);font-weight:700;margin:24px 0 12px;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.sect::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent)}

/* Карточки */
.card{padding:12px;display:flex;gap:12px;align-items:center;margin-bottom:8px;
  background:var(--panel);border:1px solid var(--border);border-radius:6px;
  cursor:pointer;transition:all 0.2s;position:relative;overflow:hidden}
.card:active{transform:scale(0.98);background:rgba(0,255,102,0.1)}
.card.done{opacity:0.4;border-style:dashed}
.card.done .ctitle{text-decoration:line-through;color:var(--dim)}
.card.crit{border-color:var(--danger);background:linear-gradient(90deg, rgba(255,0,60,0.15) 0%, transparent 100%);
  animation:critBlink 2s infinite}
@keyframes critBlink{0%,100%{box-shadow:0 0 5px rgba(255,0,60,0.2)}50%{box-shadow:0 0 20px rgba(255,0,60,0.6)}}
.dot{width:10px;height:10px;border-radius:2px;flex:none;box-shadow:0 0 8px currentColor}
.grow{flex:1;min-width:0}
.ctitle{font-size:14px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.csub{font-size:10px;color:var(--dim);margin-top:4px;display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden}
.cat-tag{font-size:9px;padding:1px 4px;border:1px solid currentColor;border-radius:2px;font-weight:700;letter-spacing:1px}
.cd{font-size:12px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;flex:none;text-align:right;text-shadow:0 0 5px var(--accent-dim)}
.cd.neg{color:var(--danger);text-shadow:0 0 5px rgba(255,0,60,0.3)}
.chk{width:24px;height:24px;border-radius:4px;border:1px solid var(--accent);flex:none;
  display:grid;place-items:center;color:transparent;background:rgba(0,0,0,0.5);cursor:pointer;transition:0.2s}
.chk.on{background:var(--accent);color:#000;box-shadow:0 0 10px var(--accent)}
.empty{padding:32px;text-align:center;color:var(--dim);font-size:12px;border:1px dashed var(--border);border-radius:6px;letter-spacing:1px}

/* Формы */
input,select,textarea,button{font-family:inherit;font-size:14px;outline:none;border:none}
.field{width:100%;padding:12px;border-radius:4px;border:1px solid var(--border);
  background:rgba(0,0,0,0.6);color:var(--accent);transition:0.2s;margin-bottom:10px}
.field:focus{border-color:var(--accent);box-shadow:0 0 10px var(--accent-dim)}
.field::placeholder{color:var(--dim2)}
.row{display:flex;gap:8px;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{padding:8px 12px;border-radius:4px;font-size:11px;border:1px solid var(--border);
  background:rgba(0,0,0,0.6);color:var(--dim);cursor:pointer;transition:0.2s;font-weight:700;letter-spacing:1px}
.chip.on{background:rgba(0,255,102,0.15);color:var(--accent);border-color:var(--accent);box-shadow:0 0 10px var(--accent-dim)}
.btn{padding:12px;border-radius:4px;border:1px solid var(--border);cursor:pointer;
  background:rgba(0,0,0,0.6);color:var(--accent);font-weight:700;transition:0.2s;
  display:flex;align-items:center;justify-content:center;gap:8px;letter-spacing:1px;text-transform:uppercase}
.btn:active{background:rgba(0,255,102,0.2);box-shadow:0 0 15px var(--accent-dim)}
.btn.primary{background:var(--accent);color:#000;border-color:var(--accent);box-shadow:0 0 10px var(--accent-dim)}
.btn.primary:active{background:#00cc52}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.danger:active{background:rgba(255,0,60,0.2)}
.btn.small{padding:8px 12px;font-size:11px}
.label{font-size:10px;letter-spacing:2px;color:var(--accent);margin:16px 0 8px;font-weight:700;text-transform:uppercase;opacity:0.8}
.hint{font-size:11px;color:var(--dim);line-height:1.5;margin-bottom:10px;letter-spacing:0.5px}
.mini{width:28px;height:28px;border-radius:4px;border:1px solid var(--border);
  background:rgba(0,0,0,0.6);color:var(--accent);display:grid;place-items:center;font-size:12px;cursor:pointer}
.remrow{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;
  border:1px solid var(--border);border-radius:4px;margin-bottom:6px;font-size:11px;background:rgba(0,0,0,0.4)}

/* Навигация */
.tabbar{display:flex;gap:4px;padding:8px;background:rgba(2,5,3,0.95);border-top:1px solid var(--border);
  backdrop-filter:blur(10px);z-index:60;width:100%;max-width:800px;margin:0 auto}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;border-radius:4px;
  font-size:9px;font-weight:700;color:var(--dim);cursor:pointer;transition:0.2s;letter-spacing:1px;background:transparent}
.tab .ic{font-size:18px;line-height:1;transition:0.2s}
.tab.active{color:var(--accent);background:rgba(0,255,102,0.1);box-shadow:inset 0 0 10px var(--accent-dim);text-shadow:0 0 5px var(--accent)}
.tab.active .ic{transform:translateY(-2px);filter:drop-shadow(0 0 5px var(--accent))}

/* Кнопка добавления */
.fab{position:fixed;right:calc(50% - 350px);bottom:calc(80px + var(--safe-bottom));width:56px;height:56px;
  border-radius:8px;border:1px solid var(--accent);font-size:28px;color:#000;
  background:var(--accent);cursor:pointer;z-index:61;
  box-shadow:0 0 20px rgba(0,255,102,0.4);display:grid;place-items:center;transition:0.2s}
@media(max-width:700px){.fab{right:16px}}
.fab:active{transform:scale(0.9) rotate(90deg);box-shadow:0 0 30px var(--accent)}

/* Модалка */
.sheetwrap{position:fixed;inset:0;z-index:90;display:flex;align-items:flex-end;
  background:rgba(0,0,0,0.8);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity 0.3s}
.sheetwrap.open{opacity:1;pointer-events:auto}
.sheet{width:100%;max-height:92dvh;overflow-y:auto;border-radius:12px 12px 0 0;
  padding:16px;transform:translateY(100%);transition:transform 0.3s cubic-bezier(0.2,1,0.3,1);
  background:#020503;border-top:1px solid var(--accent);box-shadow:0 -10px 40px rgba(0,255,102,0.15);scrollbar-width:none}
.sheet::-webkit-scrollbar{display:none}
.sheetwrap.open .sheet{transform:translateY(0)}
.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;border-bottom:1px solid var(--border);padding-bottom:10px}
.sheettitle{font-size:14px;font-weight:700;letter-spacing:2px;color:var(--accent);text-transform:uppercase}
.grab{width:40px;height:4px;border-radius:2px;background:var(--border);margin:0 auto 12px}

/* Тревога */
#alarm{position:fixed;inset:0;z-index:300;display:none;flex-direction:column;align-items:center;
  justify-content:center;gap:20px;padding:20px;text-align:center;
  background:rgba(20,0,0,0.95);backdrop-filter:blur(10px);border:4px solid var(--danger)}
#alarm.on{display:flex;animation:alarmFlash 0.5s infinite alternate}
@keyframes alarmFlash{from{box-shadow:inset 0 0 50px rgba(255,0,60,0.5)}to{box-shadow:inset 0 0 100px rgba(255,0,60,0.9)}}
#alarm .warn{font-size:80px;color:var(--danger);text-shadow:0 0 30px var(--danger);animation:shake 0.3s infinite}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#alarm .atitle{font-size:22px;font-weight:900;color:#fff;text-shadow:0 0 10px var(--danger);letter-spacing:1px}
#alarm .awhen{font-size:12px;color:rgba(255,255,255,0.8);letter-spacing:1px}
#alarm .abtns{display:flex;flex-direction:column;gap:8px;width:100%;max-width:300px;margin-top:16px}
#alarm .abtn{padding:14px;border-radius:4px;border:1px solid var(--danger);font-size:12px;
  font-weight:700;background:rgba(255,0,60,0.1);color:#fff;cursor:pointer;letter-spacing:1px;text-transform:uppercase}
#alarm .abtn:active{background:rgba(255,0,60,0.3)}
#alarm .abtn.main{background:var(--danger);color:#fff;box-shadow:0 0 15px rgba(255,0,60,0.6)}

/* Тост */
#toast{position:fixed;left:50%;bottom:calc(100px + var(--safe-bottom));transform:translate(-50%,20px);
  padding:12px 20px;border-radius:4px;font-size:12px;font-weight:700;z-index:400;opacity:0;
  pointer-events:none;transition:0.3s;max-width:90vw;text-align:center;letter-spacing:1px;
  background:rgba(0,0,0,0.9);border:1px solid var(--accent);color:var(--accent);box-shadow:0 0 15px rgba(0,255,102,0.3)}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* Календарь */
.calhead{display:flex;justify-content:space-between;align-items:center;padding:12px;background:var(--panel);border:1px solid var(--border);border-radius:4px;margin-bottom:12px}
.calhead .m{font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--accent)}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{text-align:center;font-size:10px;font-weight:700;color:var(--dim);padding:4px 0;text-transform:uppercase;letter-spacing:1px}
.day{aspect-ratio:1;border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;font-size:13px;font-weight:600;color:var(--txt);background:rgba(0,255,102,0.05);
  border:1px solid transparent;cursor:pointer;transition:0.2s}
.day.today{border-color:var(--dim);color:var(--accent);font-weight:800}
.day.sel{background:var(--accent);color:#000;box-shadow:0 0 10px var(--accent)}
.dots{display:flex;gap:2px;height:4px}
.dots i{width:4px;height:4px;border-radius:1px;display:block}

/* Статусы */
.status{display:inline-block;padding:4px 8px;border-radius:2px;font-size:10px;font-weight:700;letter-spacing:1px;border:1px solid;margin-bottom:8px}
.status.ok{color:var(--accent);border-color:var(--accent);background:rgba(0,255,102,0.1);box-shadow:0 0 10px var(--accent-dim)}
.status.bad{color:var(--danger);border-color:var(--danger);background:rgba(255,0,60,0.1)}
.status.warn{color:var(--warn);border-color:var(--warn);background:rgba(255,176,0,0.1)}

/* Фильтры */
.filterbar{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 12px;margin:0 -4px;scrollbar-width:none}
.filterbar::-webkit-scrollbar{display:none}
.fchip{padding:6px 12px;border-radius:4px;font-size:11px;font-weight:700;white-space:nowrap;
  border:1px solid var(--border);background:rgba(0,0,0,0.4);color:var(--dim);cursor:pointer;transition:0.2s;text-transform:uppercase;letter-spacing:1px}
.fchip.on{background:rgba(0,255,102,0.15);color:var(--accent);border-color:var(--accent)}

/* Онбординг */
.onboard{padding:16px;background:var(--panel);border:1px solid var(--accent);border-radius:8px;margin-bottom:16px;box-shadow:0 0 20px rgba(0,255,102,0.1);position:relative;overflow:hidden}
.onboard::before{content:'';position:absolute;top:0;left:0;width:100%;height:2px;background:var(--accent);animation:slideRight 2s infinite}
@keyframes slideRight{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.obtitle{font-size:12px;font-weight:700;margin-bottom:12px;color:var(--accent);letter-spacing:2px;text-transform:uppercase}
.obitem{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:4px;
  background:rgba(0,0,0,0.4);margin-bottom:8px;cursor:pointer;border:1px solid transparent;transition:0.2s}
.obitem:active{background:rgba(0,255,102,0.1)}
.obitem.done{opacity:0.5;border-color:var(--border)}
.obchk{width:20px;height:20px;border-radius:2px;border:1px solid var(--border);
  flex:none;display:grid;place-items:center;font-size:12px;color:transparent;transition:0.2s}
.obitem.done .obchk{background:var(--accent);border-color:var(--accent);color:#000;box-shadow:0 0 10px var(--accent)}
.obtxt b{display:block;font-size:11px;margin-bottom:2px;color:var(--accent)}
.obtxt small{font-size:10px;color:var(--dim);display:block;line-height:1.4}

/* Бегущая строка */
.ticker{width:100%;overflow:hidden;background:var(--panel);border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:4px 0;margin-bottom:16px;white-space:nowrap}
.ticker-text{display:inline-block;font-size:10px;color:var(--accent);letter-spacing:2px;animation:ticker 15s linear infinite}
@keyframes ticker{0%{transform:translateX(100vw)}100%{transform:translateX(-100%)}}
</style>
</head>
<body>

<div id="bg-grid"></div>
<div id="bg-glow"></div>
<div class="scanline"></div>
<div class="corner c-tl"></div><div class="corner c-tr"></div>
<div class="corner c-bl"></div><div class="corner c-br"></div>

<div class="app-container">
  <header class="topbar">
    <div class="brand">
      <div class="logo">⚠</div>
      <div>
        <div class="h1" id="topTitle">СИСТЕМА</div>
        <div class="sub" id="topDate">ЗАГРУЗКА...</div>
      </div>
    </div>
    <button class="iconbtn" id="btnBell" onclick="askNotify()">🔔</button>
  </header>

  <main id="main"></main>

  <nav class="tabbar">
    <button class="tab active" data-tab="today"><span class="ic">⏱</span><span>СЕГОДНЯ</span></button>
    <button class="tab" data-tab="list"><span class="ic">📋</span><span>СПИСОК</span></button>
    <button class="tab" data-tab="cal"><span class="ic">📅</span><span>КАЛЕНДАРЬ</span></button>
    <button class="tab" data-tab="set"><span class="ic">⚙</span><span>НАСТРОЙКИ</span></button>
  </nav>
</div>

<button class="fab" onclick="openEditor(null)">+</button>

<script>
const KEY='system_diary_v6';
const PRESETS=[
  {l:'5м',s:300},{l:'15м',s:900},{l:'30м',s:1800},
  {l:'1ч',s:3600},{l:'2ч',s:7200},{l:'6ч',s:21600},{l:'12ч',s:43200},
  {l:'24ч',s:86400},{l:'2д',s:172800},{l:'4д',s:345600},
  {l:'1нед',s:604800},{l:'2нед',s:1209600},{l:'1мес',s:2592000}
];
const CATS={
  none:{label:'ОБЫЧ',color:'#8890a8',icon:'•'},
  work:{label:'РАБ',color:'#00ff66',icon:'💼'},
  health:{label:'ЗДОР',color:'#00e5ff',icon:'💊'},
  money:{label:'ФИН',color:'#ffb000',icon:'💰'},
  personal:{label:'ЛИЧ',color:'#b18cff',icon:'🏠'},
  urgent:{label:'ВАЖН',color:'#ff003c',icon:'🔥'}
};
const COLORS=['#00ff66','#00e5ff','#ff003c','#ffb000','#b18cff','#ffffff','#8890a8'];
const DEF={ntfy:'',sound:true,theme:'dark',ntfyConfirmed:false};
const FIRE_WINDOW=30*60*1000;
const MISSED_WINDOW=7*24*3600*1000;
const NTFY_HORIZON=14*24*3600*1000;

let state=loadState(),tab='today',editing=null,
    calMonth=(()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),1).getTime()})(),
    selDay=null,search='',filterCat='all',alarmQueue=[],currentAlarm=null,
    lastDayKey=new Date().toDateString(),missedCache=[];

function loadState(){
  try{
    const raw=JSON.parse(localStorage.getItem(KEY));
    if(raw&&Array.isArray(raw.events)){
      raw.events.forEach(ev=>{
        ev.fired=ev.fired||[];ev._scheduled=ev._scheduled||{};
        ev.reminders=(ev.reminders||[]).map(r=>{if(!r.id)r.id=uid();return r;});
      });
      return {events:raw.events,snoozes:raw.snoozes||[],settings:Object.assign({},DEF,raw.settings||{})};
    }
  }catch(e){}
  return {events:[],snoozes:[],settings:Object.assign({},DEF)};
}
function saveState(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}

const $=id=>document.getElementById(id);
const p2=n=>String(n).padStart(2,'0');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtTime=ts=>{const d=new Date(ts);return p2(d.getHours())+':'+p2(d.getMinutes());};
const fmtDateTime=ts=>{const d=new Date(ts);return p2(d.getDate())+'.'+p2(d.getMonth()+1)+'.'+d.getFullYear()+' '+p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds());};

function fmtDay(ts){
  const d=new Date(ts),n=new Date();
  const s=x=>new Date(x.getFullYear(),x.getMonth(),x.getDate()).getTime();
  const diff=Math.round((s(d)-s(n))/86400000);
  if(diff===0)return 'СЕГОДНЯ';if(diff===1)return 'ЗАВТРА';if(diff===-1)return 'ВЧЕРА';
  const wd=['ВС','ПН','ВТ','СР','ЧТ','ПТ','СБ'][d.getDay()];
  return wd+' '+p2(d.getDate())+'.'+p2(d.getMonth()+1);
}

function fmtDur(ms){
  const neg=ms<0;ms=Math.abs(ms);
  const t=Math.floor(ms/1000),d=Math.floor(t/86400),h=Math.floor(t%86400/3600),m=Math.floor(t%3600/60),s=t%60;
  let out;
  if(d>0)out=d+'д '+h+'ч '+m+'м';
  else if(h>0)out=h+'ч '+m+'м';
  else if(m>0)out=m+'м '+p2(s)+'с';
  else out=s+'с';
  return (neg?'-':'')+out;
}

function secLabel(s){
  if(s>=2592000&&s%2592000===0)return (s/2592000)+'мес';
  if(s>=604800&&s%604800===0)return (s/604800)+'нед';
  if(s>=86400&&s%86400===0)return (s/86400)+'д';
  if(s>=3600&&s%3600===0)return (s/3600)+'ч';
  if(s>=60&&s%60===0)return (s/60)+'м';
  return s+'с';
}
const toLocalInput=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())+'T'+p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds());};
const fromLocalInput=v=>{if(!v)return null;const t=new Date(v).getTime();return isNaN(t)?null:t;};
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('on');clearTimeout(t._tm);t._tm=setTimeout(()=>t.classList.remove('on'),2500);}
function vibrate(pat){try{if(navigator.vibrate)navigator.vibrate(pat);}catch(e){}}
function download(name,content,type){
  const b=new Blob([content],{type:type+';charset=utf-8'}),a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
}

function stepDate(d,rep){
  if(rep==='daily')d.setDate(d.getDate()+1);
  else if(rep==='weekly')d.setDate(d.getDate()+7);
  else if(rep==='monthly'){
    const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+1);
    const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
    d.setDate(Math.min(day,last));
  }
  else if(rep==='yearly'){
    const month=d.getMonth(),day=d.getDate();d.setDate(1);d.setFullYear(d.getFullYear()+1);
    const last=new Date(d.getFullYear(),month+1,0).getDate();
    d.setMonth(month);d.setDate(Math.min(day,last));
  }
}
function nextOcc(ev,from){
  if(!ev.repeat||ev.repeat==='none')return ev.ts;
  if(ev.ts>=from)return ev.ts;
  const cur=new Date(ev.ts);let g=0;
  while(cur.getTime()<from&&g++<5000)stepDate(cur,ev.repeat);
  return cur.getTime();
}
function latestOcc(ev,limit){
  if(!ev.repeat||ev.repeat==='none')return ev.ts<=limit?ev.ts:null;
  if(ev.ts>limit)return null;
  const cur=new Date(ev.ts);let g=0;
  while(g++<5000){const nx=new Date(cur.getTime());stepDate(nx,ev.repeat);if(nx.getTime()>limit)break;cur.setTime(nx.getTime());}
  return cur.getTime();
}
function occsInRange(ev,a,b){
  const out=[];
  if(!ev.repeat||ev.repeat==='none'){if(ev.ts>=a&&ev.ts<b)out.push(ev.ts);return out;}
  const cur=new Date(ev.ts);let g=0;
  while(cur.getTime()<a&&g++<5000)stepDate(cur,ev.repeat);
  let g2=0;
  while(cur.getTime()<b&&g2++<400){if(cur.getTime()>=a)out.push(cur.getTime());stepDate(cur,ev.repeat);}
  return out;
}
function occsForward(ev,from,to){
  const out=[];
  if(!ev.repeat||ev.repeat==='none'){if(ev.ts>=from&&ev.ts<=to)out.push(ev.ts);return out;}
  const cur=new Date(ev.ts);let g=0;
  while(cur.getTime()<from&&g++<5000)stepDate(cur,ev.repeat);
  let g2=0;
  while(cur.getTime()<=to&&g2++<400){out.push(cur.getTime());stepDate(cur,ev.repeat);}
  return out;
}

function remTarget(ev,r,now){
  if(r.kind==='abs')return r.ts;
  const occ=latestOcc(ev,now+r.sec*1000);
  return occ==null?null:occ-r.sec*1000;
}
function remKey(ev,r,now){
  if(r.kind==='abs')return r.id+'@abs';
  const occ=latestOcc(ev,now+r.sec*1000);
  return r.id+'@'+occ;
}
function remLabel(r){return r.kind==='abs'?'ТОЧНО '+fmtDateTime(r.ts):'ЗА '+secLabel(r.sec);}

function getMissed(now){
  const out=[];
  for(const ev of state.events){
    if(ev.done)continue;
    for(const r of ev.reminders){
      const target=remTarget(ev,r,now);
      if(target==null)continue;
      if(target<now-60000&&target>now-MISSED_WINDOW){
        const key=remKey(ev,r,now);
        if(!ev.fired.includes(key))out.push({ev,r,target,key});
      }
    }
  }
  return out;
}

function checkReminders(now){
  let changed=false;
  const seen=new Set();
  for(const ev of state.events){
    if(ev.done)continue;
    for(const r of ev.reminders){
      const target=remTarget(ev,r,now);
      if(target==null||target>now)continue;
      const key=remKey(ev,r,now);
      if(ev.fired.includes(key))continue;
      const age=now-target;
      if(age>FIRE_WINDOW){ev.fired.push(key);changed=true;continue;}
      ev.fired.push(key);changed=true;
      if(ev.fired.length>300)ev.fired=ev.fired.slice(-300);
      const dedup=`${ev.title}|${Math.floor(target/1000)}`;
      if(seen.has(dedup))continue;
      seen.add(dedup);
      queueAlarm({title:ev.title||'СОБЫТИЕ',sub:remLabel(r),when:target,critical:ev.priority==='critical'});
    }
  }
  if(changed)saveState();
}

function checkSnoozes(now){
  let changed=false;
  state.snoozes=state.snoozes.filter(s=>{
    if(s.ts<=now){queueAlarm({title:s.title,sub:s.sub||'ОТЛОЖЕНО',when:s.ts,critical:false});changed=true;return false;}
    return true;
  });
  if(changed)saveState();
}

let audioCtx=null,siren=null;
function unlockAudio(){
  try{
    if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    audioCtx.resume();
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type='square';o.frequency.value=440;g.gain.value=0.0001;o.connect(g);g.connect(audioCtx.destination);
    g.gain.exponentialRampToValueAtTime(0.1,audioCtx.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+0.2);
    o.start();o.stop(audioCtx.currentTime+0.25);
    state.settings.sound=true;saveState();toast('ЗВУК: ВКЛ');
  }catch(e){toast('ЗВУК: ОШИБКА');}
}
function startSiren(){
  if(!state.settings.sound)return;
  try{
    if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended')audioCtx.resume();
    stopSiren();
    const o=audioCtx.createOscillator(),g=audioCtx.createGain(),lfo=audioCtx.createOscillator(),lg=audioCtx.createGain();
    o.type='square';o.frequency.value=880;lfo.type='square';lfo.frequency.value=4;lg.gain.value=200;
    lfo.connect(lg);lg.connect(o.frequency);g.gain.value=0.0001;
    g.gain.exponentialRampToValueAtTime(0.08,audioCtx.currentTime+0.05);
    o.connect(g);g.connect(audioCtx.destination);o.start();lfo.start();
    siren={o,g,lfo};
  }catch(e){}
}
function stopSiren(){
  if(!siren||!audioCtx)return;
  try{const{o,g,lfo}=siren;g.gain.cancelScheduledValues(audioCtx.currentTime);
    g.gain.setTargetAtTime(0.0001,audioCtx.currentTime,0.02);
    setTimeout(()=>{try{o.stop();lfo.stop();}catch(e){}},150);}catch(e){}
  siren=null;
}

function queueAlarm(item){alarmQueue.push(item);if(!currentAlarm)showNextAlarm();}
function showNextAlarm(){
  if(!alarmQueue.length){currentAlarm=null;$('alarm').classList.remove('on');stopSiren();return;}
  currentAlarm=alarmQueue.shift();
  $('alarmTitle').textContent=currentAlarm.title;
  $('alarmWhen').textContent=currentAlarm.sub+' :: '+fmtDateTime(currentAlarm.when);
  $('alarm').classList.add('on');
  startSiren();vibrate([300,100,300,100,300,100,600]);
  notifySystem(currentAlarm);
}
function dismissAlarm(min){
  if(min>0&&currentAlarm){
    state.snoozes.push({id:uid(),ts:Date.now()+min*60000,title:currentAlarm.title,sub:'ОТЛОЖЕНО'});
    saveState();
  }
  stopSiren();$('alarm').classList.remove('on');
  currentAlarm=null;setTimeout(showNextAlarm,250);
}
function testAlarm(){queueAlarm({title:'ТЕСТ СИСТЕМЫ',sub:'ДИАГНОСТИКА',when:Date.now(),critical:true});}
async function notifySystem(item){
  try{
    if(!('Notification' in window)||Notification.permission!=='granted')return;
    const reg=await navigator.serviceWorker.ready;
    reg.showNotification('⚠️ '+item.title,{
      body:item.sub+' :: '+fmtDateTime(item.when),
      tag:'alarm-'+Date.now(),
      requireInteraction:true,silent:false
    });
  }catch(e){}
}

// ИСПРАВЛЕНА ОТПРАВКА
async function postNtfySchedule(ev,r,target){
  if(!state.settings.ntfy)return false;
  const secs=Math.round((target-Date.now())/1000);
  if(secs<-300)return false; // Отсекаем только совсем старое
  
  try{
    const res=await fetch('https://ntfy.sh',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        topic:state.settings.ntfy,
        title:'⚠️ '+(ev.title||'СОБЫТИЕ'),
        message:remLabel(r)+'\n'+fmtDateTime(target),
        priority:5,
        tags:['warning','skull'],
        delay:secs>10?secs+'s':undefined, // Убрали блокировку 15 сек
        id:'ev_'+ev.id+'_'+r.id+'_'+Date.now() // Уникальный ID всегда
      })
    });
    return res.ok;
  }catch(e){return false;}
}

async function scheduleNtfyForEvent(ev){
  if(!state.settings.ntfy||!navigator.onLine)return 0;
  const now=Date.now(),until=now+NTFY_HORIZON;
  const occs=occsForward(ev,now,until);
  let count=0;
  for(const r of ev.reminders){
    for(const occ of occs){
      const target=r.kind==='abs'?r.ts:occ-r.sec*1000;
      if(target<now-300000)continue;
      const key=r.id+'@'+occ;
      // Принудительно отправляем, если ещё не отправляли ИЛИ если это ручное сохранение
      if(ev._scheduled&&ev._scheduled[key])continue; 
      const ok=await postNtfySchedule(ev,r,target);
      if(ok){ev._scheduled=ev._scheduled||{};ev._scheduled[key]=1;count++;}
    }
  }
  if(count)saveState();
  return count;
}

async function syncNtfyAll(silent=false){
  if(!state.settings.ntfy){if(!silent)toast('ОШИБКА: НЕТ ТОПИКА');return 0;}
  if(!navigator.onLine){if(!silent)toast('ОШИБКА: ОФЛАЙН');return 0;}
  let total=0;
  for(const ev of state.events){
    if(ev.done)continue;
    total+=await scheduleNtfyForEvent(ev);
  }
  if(!silent)toast(total?`ОТПРАВЛЕНО: ${total}`:'НЕЧЕГО ОТПРАВЛЯТЬ');
  return total;
}

async function testNtfy(){
  if(!state.settings.ntfy){toast('ОШИБКА: НЕТ ТОПИКА');return;}
  toast('ОТПРАВКА...');
  try{
    const res=await fetch('https://ntfy.sh',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({topic:state.settings.ntfy,title:'⚠️ ТЕСТ',
        message:'Связь установлена.',priority:5,tags:['warning','skull'],
        id:'test_'+Date.now()})
    });
    if(res.ok){
      state.settings.ntfyConfirmed=true;saveState();
      toast('УСПЕШНО ✓');
    } else toast('ОШИБКА: '+res.status);
  }catch(e){toast('ОШИБКА СЕТИ');}
}

function icsEsc(s){return String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');}
function icsUTC(ts){return new Date(ts).toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';}
function getTZID(){
  const off=-new Date().getTimezoneOffset();
  const sign=off>=0?'+':'-',abs=Math.abs(off);
  return 'Etc/GMT'+sign+Math.floor(abs/60);
}
function exportICS(){
  const now=Date.now(),tz=getTZID();
  let out=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//SystemTerminal//RU','CALSCALE:GREGORIAN','METHOD:PUBLISH'];
  state.events.forEach(ev=>{
    if(ev.done)return;
    const dur=ev.duration||3600000;
    const dtStart=new Date(ev.ts).toLocaleString('sv-SE').replace(/[-:]/g,'').replace(' ','T');
    const dtEnd=new Date(ev.ts+dur).toLocaleString('sv-SE').replace(/[-:]/g,'').replace(' ','T');
    out.push('BEGIN:VEVENT');
    out.push('UID:'+ev.id+'@system');
    out.push('DTSTAMP:'+icsUTC(now));
    out.push('DTSTART;TZID='+tz+':'+dtStart);
    out.push('DTEND;TZID='+tz+':'+dtEnd);
    out.push('SUMMARY:'+icsEsc(ev.title||'СОБЫТИЕ'));
    if(ev.notes)out.push('DESCRIPTION:'+icsEsc(ev.notes));
    if(ev.repeat==='daily')out.push('RRULE:FREQ=DAILY');
    if(ev.repeat==='weekly')out.push('RRULE:FREQ=WEEKLY');
    if(ev.repeat==='monthly')out.push('RRULE:FREQ=MONTHLY');
    if(ev.repeat==='yearly')out.push('RRULE:FREQ=YEARLY');
    (ev.reminders||[]).forEach(r=>{
      out.push('BEGIN:VALARM');
      if(r.kind==='abs'){
        const delta=Math.round((r.ts-ev.ts)/1000);
        out.push('TRIGGER:'+(delta>=0?'PT'+delta+'S':'-PT'+(-delta)+'S'));
      }else{
        out.push('TRIGGER:-PT'+r.sec+'S');
      }
      out.push('ACTION:DISPLAY');
      out.push('DESCRIPTION:'+icsEsc(ev.title||'СОБЫТИЕ'));
      out.push('END:VALARM');
    });
    out.push('END:VEVENT');
  });
  out.push('END:VCALENDAR');
  download('system_events.ics',out.join('\r\n'),'text/calendar');
  toast('ICS: СКАЧАНО');
}
function exportJSON(){
  download('system_backup.json',JSON.stringify(state,null,2),'application/json');
  toast('JSON: СКАЧАНО');
}
function importJSON(inp){
  const f=inp.files&&inp.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const d=JSON.parse(rd.result);
      if(d&&Array.isArray(d.events)){state=Object.assign({},state,d);saveState();render();toast('ДАННЫЕ: ЗАГРУЖЕНЫ');}
      else toast('ОШИБКА: ПЛОХОЙ ФАЙЛ');
    }catch(e){toast('ОШИБКА ЧТЕНИЯ');}
  };
  rd.readAsText(f);inp.value='';
}
function resetAll(){
  if(!confirm('УДАЛИТЬ ВСЁ? НЕОБРАТИМО.'))return;
  state.events=[];state.snoozes=[];saveState();render();toast('ДАННЫЕ: СТЕРТЫ');
}

  else if(tab==='list')html=renderList();

  $('topTitle').textContent=titles[tab];

  const on=('Notification' in window)&&Notification.permission==='granted';
  $('btnBell').textContent=on?'🔔':'🔕';
  $('btnBell').classList.toggle('off',!on);

function catBadge(ev){
  if(!ev.category||ev.category==='none')return '';
  const c=CATS[ev.category];
  return `<span class="cat-tag" style="color:${c.color}">${c.icon} ${c.label}</span>`;
}

function cardHTML(o,i){
  const ev=o.ev,ts=o.ts,diff=ts-Date.now();
  const crit=ev.priority==='critical'&&!ev.done;
  const c=CATS[ev.category||'none'];
  return `<div class="card ${ev.done?'done':''} ${crit?'crit':''}" data-open="${esc(ev.id)}">
    <button class="chk ${ev.done?'on':''}" data-done="${esc(ev.id)}" onclick="event.stopPropagation();toggleDone('${esc(ev.id)}')">✓</button>
    <div class="dot" style="color:${ev.color||c.color};background:${ev.color||c.color}"></div>
    <div class="grow">
      <div class="ctitle">${esc(ev.title)}</div>
      <div class="csub">${catBadge(ev)}<span>${fmtDay(ts)} ${fmtTime(ts)}${ev.repeat!=='none'?' [Ц]':''}${ev.reminders&&ev.reminders.length?' [У:'+ev.reminders.length+']':''}</span></div>
    </div>
    <div class="cd ${diff<0?'neg':''}" data-cd="${ts}">${diff<0?'ПРОШЛО':fmtDur(diff)}</div>
  </div>`;
}

function renderToday(){
  const now=Date.now();
  const all=state.events.filter(e=>!e.done).map(e=>({ev:e,ts:nextOcc(e,now)}));
  const future=all.filter(o=>o.ts>=now).sort((a,b)=>a.ts-b.ts);
  const past=all.filter(o=>o.ts<now).sort((a,b)=>b.ts-a.ts);
  
  let h=`<div class="ticker"><div class="ticker-text">>>> СИСТЕМА АКТИВНА >>> ОЖИДАНИЕ СОБЫТИЙ >>> ВСЕ ПРОТОКОЛЫ В НОРМЕ >>> СЛЕДУЮЩИЙ ЦИКЛ ЗАПУЩЕН >>></div></div>`;
  
  h+=renderOnboard();
  
  if(missedCache.length){
    h+=`<div class="panel" style="border-color:var(--danger)">
      <div class="hint" style="color:var(--danger);font-weight:700;margin-bottom:10px">ВНИМАНИЕ: ПРОПУЩЕНО СИГНАЛОВ - ${missedCache.length}</div>
      <button class="btn danger" style="width:100%" onclick="showMissed()">ПОКАЗАТЬ</button>
    </div>`;
  }
  
  if(future.length){
    const n=future[0],diff=n.ts-now;
    h+=`<div class="hero">
      <div class="lbl">СЛЕДУЮЩЕЕ СОБЫТИЕ</div>
      <div class="big" data-cd="${n.ts}">${fmtDur(diff)}</div>
      <div class="ttl">${esc(n.ev.title)}</div>
      <div class="meta">${fmtDay(n.ts)} В ${fmtTime(n.ts)}</div>
    </div>`;
  } else {
    h+=`<div class="hero">
      <div class="lbl">ОЧЕРЕДЬ ПУСТА</div>
      <div class="big">0с</div>
      <div class="ttl">НЕТ ЗАПЛАНИРОВАННЫХ СОБЫТИЙ</div>
      <div class="meta">НАЖМИ + ДЛЯ ДОБАВЛЕНИЯ</div>
    </div>`;
  }
  
  const todays=future.filter(o=>fmtDay(o.ts)==='СЕГОДНЯ');
  h+='<div class="sect">СЕГОДНЯ</div>';
  h+=todays.length?todays.map(cardHTML).join(''):'<div class="empty">НЕТ ЗАПИСЕЙ</div>';
  
  const soon=future.filter(o=>fmtDay(o.ts)!=='СЕГОДНЯ').slice(0,8);
  if(soon.length){h+='<div class="sect">ПРЕДСТОЯЩИЕ</div>';h+=soon.map(cardHTML).join('');}
  
  if(past.length){h+='<div class="sect">АРХИВ</div>';h+=past.slice(0,6).map(cardHTML).join('');}
  
  return h;
}

function renderListOnly(){
  const body=$('listbody');if(!body)return;
  const now=Date.now(),q=search.trim().toLowerCase();
  const matches=e=>{
    if(filterCat==='done')return e.done;
    if(filterCat!=='all'&&e.category!==filterCat)return false;
    if(e.done&&filterCat!=='done')return false;
    return !q||(e.title||'').toLowerCase().includes(q)||(e.notes||'').toLowerCase().includes(q);
  };
  const items=state.events.filter(matches).map(e=>({ev:e,ts:nextOcc(e,now)}));
  const future=items.filter(o=>o.ts>=now).sort((a,b)=>a.ts-b.ts);
  const past=items.filter(o=>o.ts<now).sort((a,b)=>b.ts-a.ts);
  
  let h='<div class="sect">АКТИВНЫЕ ('+future.length+')</div>';
  h+=future.length?future.map(cardHTML).join(''):'<div class="empty">ПУСТО</div>';
  if(past.length){h+='<div class="sect">АРХИВ ('+past.length+')</div>';h+=past.slice(0,30).map(cardHTML).join('');}
  body.innerHTML=h;
}

function renderCal(){
  const base=new Date(calMonth),y=base.getFullYear(),m=base.getMonth();
  const first=new Date(y,m,1),startWd=(first.getDay()+6)%7;
  const daysInMonth=new Date(y,m+1,0).getDate();
  const a=new Date(y,m,1).getTime(),b=new Date(y,m+1,1).getTime();
  const marks={};
  state.events.forEach(ev=>{if(ev.done)return;occsInRange(ev,a,b).forEach(ts=>{
    const d=new Date(ts).getDate();(marks[d]=marks[d]||[]).push(CATS[ev.category||'none'].color);});});
  const todayD=new Date(),isThisMonth=todayD.getFullYear()===y&&todayD.getMonth()===m;
  
  let h=`<div class="calhead">
    <button class="mini" onclick="calShift(-1)"><</button>
    <div class="m">${base.toLocaleDateString('ru-RU',{month:'long',year:'numeric'}).toUpperCase()}</div>
    <button class="mini" onclick="calShift(1)">></button>
  </div><div class="calgrid">`;
  ['ПН','ВТ','СР','ЧТ','ПТ','СБ','ВС'].forEach(w=>h+=`<div class="wd">${w}</div>`);
  for(let i=0;i<startWd;i++)h+='<div></div>';
  for(let d=1;d<=daysInMonth;d++){
    const cls=['day'];
    if(isThisMonth&&todayD.getDate()===d)cls.push('today');
    if(selDay===d)cls.push('sel');
    const ds=marks[d]||[];
    h+=`<div class="${cls.join(' ')}" onclick="pickDay(${d})">${d}<div class="dots">${
      ds.slice(0,3).map(c=>`<i style="background:${c}"></i>`).join('')}</div></div>`;
  }
  h+='</div>';
  
  if(selDay){
    const dayA=new Date(y,m,selDay).getTime(),dayB=dayA+86400000;
    const list=[];
    state.events.forEach(ev=>{if(ev.done)return;occsInRange(ev,dayA,dayB).forEach(ts=>list.push({ev,ts}));});
    list.sort((x,y2)=>x.ts-y2.ts);
    h+=`<div class="sect">ЦЕЛЬ: ${selDay} ${base.toLocaleDateString('ru-RU',{month:'short'}).toUpperCase()}</div>`;
    h+=list.length?list.map(cardHTML).join(''):'<div class="empty">НЕТ ДАННЫХ</div>';
  } else {
    const now=Date.now();
    const list=state.events.filter(e=>!e.done).map(e=>({ev:e,ts:nextOcc(e,now)})).filter(o=>o.ts>=now).sort((x,y2)=>x.ts-y2.ts).slice(0,5);
    h+='<div class="sect">БЛИЖАЙШИЕ</div>';
    h+=list.length?list.map(cardHTML).join(''):'<div class="empty">ПУСТО</div>';
  }
  return h;
}
function calShift(n){const d=new Date(calMonth);d.setMonth(d.getMonth()+n);calMonth=d.getTime();selDay=null;render();}
function pickDay(d){selDay=selDay===d?null:d;render(true);}

function quickSet(v){
  const d=new Date();
  if(v==='evening'){d.setHours(19,0,0,0);if(d.getTime()<Date.now())d.setDate(d.getDate()+1);}
  else if(v==='tomorrow9'){d.setDate(d.getDate()+1);d.setHours(9,0,0,0);}
  else if(v==='week'){d.setDate(d.getDate()+7);d.setHours(9,0,0,0);}
  else{d.setTime(Date.now()+v);d.setSeconds(0,0);}
  $('f-ts').value=toLocalInput(d.getTime());
  toast('ВРЕМЯ: УСТАНОВЛЕНО');
}
function togglePreset(sec){
  const i=editing.reminders.findIndex(r=>r.kind==='rel'&&r.sec===sec);
  if(i>=0)editing.reminders.splice(i,1);
  else editing.reminders.push({id:uid(),kind:'rel',sec});
  $('f-presets').innerHTML=PRESETS.map(p=>{
    const on=editing.reminders.some(r=>r.kind==='rel'&&r.sec===p.s);
    return `<div class="chip ${on?'on':''}" onclick="togglePreset(${p.s})">${p.l}</div>`;
  }).join('');
  renderRemList();
}
function addCustomRem(){
  const n=parseFloat($('f-cnum').value),u=parseInt($('f-cunit').value,10);
  if(!n||n<=0){toast('ОШИБКА: НЕВЕРНОЕ ЧИСЛО');return;}
  editing.reminders.push({id:uid(),kind:'rel',sec:Math.round(n*u)});
  renderRemList();
}
function addAbsRem(){

  editing.reminders.push({id:uid(),kind:'abs',ts});
  $('f-abs').value='';renderRemList();
}
function delRem(i){
  editing.reminders.splice(i,1);renderRemList();
  $('f-presets').innerHTML=PRESETS.map(p=>{
    const on=editing.reminders.some(r=>r.kind==='rel'&&r.sec===p.s);
    return `<div class="chip ${on?'on':''}" onclick="togglePreset(${p.s})">${p.l}</div>`;
  }).join('');
}
function renderRemList(){
  const box=$('f-remlist');if(!box)return;
  if(!editing.reminders.length){box.innerHTML='<div class="hint" style="margin-bottom:10px">НЕТ НАПОМИНАНИЙ</div>';return;}
  box.innerHTML=editing.reminders.map((r,i)=>
    `<div class="remrow"><span>> ${r.kind==='abs'?'ТОЧНО '+fmtDateTime(r.ts):'ЗА '+secLabel(r.sec)}</span>
    <button class="mini" onclick="delRem(${i})">X</button></div>`).join('');
}
async function saveEditor(){
  const ts=fromLocalInput($('f-ts').value);
  if(ts==null){toast('ОШИБКА: НЕВЕРНОЕ ВРЕМЯ');return;}
  const newTs=ts,oldTs=editing.ts;
  editing.title=$('f-title').value.trim()||'БЕЗ ИМЕНИ';
  editing.ts=newTs;
  editing.notes=$('f-notes').value;
  editing.repeat=$('f-repeat').value;
  editing.duration=Math.max(0,(parseFloat($('f-dur').value)||0)*60000)||3600000;
  
  // ЖЕСТКИЙ СБРОС, чтобы гарантировать отправку
  editing._scheduled={};
  
  const now=Date.now();
  editing.reminders.forEach(r=>{
    const t=remTarget(editing,r,now);
    if(t!=null&&t<now-60000){
      const k=remKey(editing,r,now);
      if(!editing.fired.includes(k))editing.fired.push(k);
    }
  });
  const i=state.events.findIndex(e=>e.id===editing.id);
  if(i>=0)state.events[i]=editing;else state.events.push(editing);
  saveState();
  closeSheet();render();
  
  if(state.settings.ntfy){
    const n=await scheduleNtfyForEvent(editing);
    if(n)toast('ДАННЫЕ: СОХРАНЕНО [TX:'+n+']');
    else toast('ДАННЫЕ: СОХРАНЕНО');
  } else toast('ДАННЫЕ: СОХРАНЕНО');
}
function deleteEvent(){
  if(!editing)return;
  state.events=state.events.filter(e=>e.id!==editing.id);
  saveState();closeSheet();render();toast('ДАННЫЕ: УДАЛЕНО');
}
function toggleDone(id){
  const ev=state.events.find(e=>e.id===id);if(!ev)return;
  ev.done=!ev.done;saveState();
  if(ev.done)vibrate(50);
  render(true);
}
function showMissed(){
  if(!missedCache.length)return;
  missedCache.slice().forEach(m=>{
    queueAlarm({title:m.ev.title,sub:remLabel(m.r)+' [ПРОПУЩЕНО]',when:m.target,critical:true});
    m.ev.fired.push(m.key);
  });
  missedCache=[];saveState();render();
}
function saveNtfy(){
  state.settings.ntfy=$('s-ntfy').value.trim().replace(/[^a-zA-Z0-9_\-]/g,'');
  state.settings.ntfyConfirmed=false;
  saveState();toast('ТОПИК: СОХРАНЕН. НАЖМИ ТЕСТ.');render(true);
}
function setTheme(t){
  state.settings.theme=t;saveState();
  applyTheme();render(true);
}
function applyTheme(){
  document.documentElement.setAttribute('data-theme','dark');
}
function toggleSound(){
  state.settings.sound=!state.settings.sound;saveState();
  if(state.settings.sound)unlockAudio();
  render(true);
}
async function askNotify(){
  if(!('Notification' in window)){toast('ОШИБКА: ДОБАВЬ НА ЭКРАН');return;}
  if(Notification.permission==='granted'){toast('УЖЕ РАЗРЕШЕНО');return;}
  try{
    const p=await Notification.requestPermission();
    if(p==='granted'){
      toast('ДОСТУП: РАЗРЕШЕН');
      const reg=await navigator.serviceWorker.ready;
      reg.showNotification('⚠️ СИСТЕМА',{body:'Терминал активен.'});
    } else toast('ОШИБКА: ОТКАЗАНО');
  }catch(e){toast('ОШИБКА: '+e.message);}
  updateBell();render(true);
}

function tickUI(){
  const now=Date.now();
  document.querySelectorAll('[data-cd]').forEach(el=>{
    const t=+el.dataset.cd,diff=t-now;
    const txt=diff>0?(el.classList.contains('big')?fmtDur(diff):fmtDur(diff)):'ПРОШЛО';
    el.textContent=txt;
    if(el.classList.contains('big')||el.classList.contains('cd'))el.classList.toggle('neg',diff<0);
  });
}
function tick(){
  const now=Date.now();
  tickUI();
  checkReminders(now);
  checkSnoozes(now);
  const dk=new Date().toDateString();
  if(dk!==lastDayKey){lastDayKey=dk;render(true);}
}

async function initSW(){
  if(!('serviceWorker' in navigator))return;
  const swCode=`
    const CACHE='system-v6';
    self.addEventListener('install',()=>self.skipWaiting());
    self.addEventListener('activate',e=>e.waitUntil(clients.claim()));
    self.addEventListener('fetch',e=>{
      if(e.request.method!=='GET')return;
      e.respondWith(
        fetch(e.request).then(res=>{
          const clone=res.clone();
          caches.open(CACHE).then(c=>c.put(e.request,clone)).catch(()=>{});
          return res;
        }).catch(()=>caches.match(e.request).then(r=>r||fetch(e.request)))
      );
    });
    self.addEventListener('notificationclick',e=>{
      e.notification.close();
      e.waitUntil(clients.matchAll({type:'window'}).then(list=>{
        for(const c of list)if(c.url.includes(self.registration.scope))return c.focus();
        return clients.openWindow('./');
      }));
    });
  `;
  try{
    const blob=new Blob([swCode],{type:'application/javascript'});
    const url=URL.createObjectURL(blob);
    await navigator.serviceWorker.register(url);
  }catch(e){console.warn('SW:',e);}
}

  const icon=`data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxODAgMTgwIj48cmVjdCB3aWR0aD0iMTgwIiBoZWlnaHQ9IjE4MCIgcng9IjQwIiBmaWxsPSIjMDIwNTAzIi8+PHBhdGggZD0iTTUwIDUwIEwxMzAgNTAgTDEzMCAxMzAgTDUwIDEzMCBaIiBmaWxsPSJub25lIiBzdHJva2U9IiMwMGZmNjYiIHN0cm9rZS13aWR0aD0iNiIgc3Ryb2tlLWxpbmVqb2luPSJyb3VuZCIvPjxjaXJjbGUgY3g9IjkwIiBjeT0iOTAiIHI9IjE1IiBmaWxsPSIjMDBmZjY2Ii8+PC9zdmc+`;
  const manifest={
    name:'СИСТЕМА',short_name:'СИСТЕМА',start_url:'./',scope:'./',
    display:'standalone',orientation:'portrait',
    background_color:'#020503',theme_color:'#020503',
    icons:[{src:icon,sizes:'180x180',type:'image/svg+xml',purpose:'any maskable'}]
  };
  const blob=new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'});
  const url=URL.createObjectURL(blob);
  const link=document.createElement('link');
  link.rel='manifest';link.href=url;
  document.head.appendChild(link);
}

async function init(){
  applyTheme();
  initManifest();
  await initSW();
  document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;selDay=null;render();}));
  $('main').addEventListener('click',e=>{
    const done=e.target.closest('[data-done]');if(done)return;
    const card=e.target.closest('[data-open]');
    if(card){const ev=state.events.find(x=>x.id===card.dataset.open);if(ev)openEditor(ev);}
  });
  missedCache=getMissed(Date.now());
  render();
  setTimeout(()=>{if(state.settings.ntfy&&state.settings.ntfyConfirmed&&navigator.onLine)syncNtfyAll(true);},2500);
  window.addEventListener('online',()=>{if(state.settings.ntfy)syncNtfyAll(true);});
  setInterval(tick,500);
  setInterval(()=>{if(tab==='today'||tab==='cal')render(true);},60000);
}
init();
</script>
